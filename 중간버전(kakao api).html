    function userKey(base) {
      const uid = (state && state.user && state.user.id) ? state.user.id : 'guest';

    function distanceBetween(a, b) {
      const lat1 = Array.isArray(a) ? Number(a[0]) : Number(a.lat);
      const lon1 = Array.isArray(a) ? Number(a[1]) : Number(a.lon);
      const lat2 = Array.isArray(b) ? Number(b[0]) : Number(b.lat);
      const lon2 = Array.isArray(b) ? Number(b[1]) : Number(b.lon);
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const s = Math.sin(dLat/2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dLon/2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
    }
    function routeMetricGeometry(route) {

    function routeGeometryDistance(route) {
      const geom = routeMetricGeometry(route);
      let total = 0;
      for (let i = 1; i < geom.length; i++) total += distanceBetween(geom[i - 1], geom[i]);
      return total || route?.distanceMeters || 0;
    }
    function projectPointOnSegmentMeters(point, a, b) {
      const lat0 = Number(point.lat) * Math.PI / 180;
      const mLat = 111320;
      const mLon = 111320 * Math.cos(lat0);
      const px = Number(point.lon) * mLon, py = Number(point.lat) * mLat;
      const ax = Number(a[1]) * mLon, ay = Number(a[0]) * mLat;
      const bx = Number(b[1]) * mLon, by = Number(b[0]) * mLat;
      const dx = bx - ax, dy = by - ay;
      const denom = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / denom));
      const proj = [Number(a[0]) + (Number(b[0]) - Number(a[0])) * t, Number(a[1]) + (Number(b[1]) - Number(a[1])) * t];
      const dist = Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
      return { t, proj, dist };
    }
    function navigationMetrics(route, location = state.currentLocation) {
      const geom = routeMetricGeometry(route);
      const total = routeGeometryDistance(route);
      if (!route || !location || geom.length < 2 || !total) {
        return { remaining: route?.distanceMeters || total || 0, progressed: 0, progress: 0, nearestIndex: 0 };
      }
      let walkedBefore = 0;
      let best = { dist: Infinity, progressed: 0, remaining: total, nearestIndex: 0 };
      for (let i = 1; i < geom.length; i++) {
        const segLen = distanceBetween(geom[i - 1], geom[i]);
        const proj = projectPointOnSegmentMeters(location, geom[i - 1], geom[i]);
        if (proj.dist < best.dist) {
          const progressed = walkedBefore + segLen * proj.t;
          best = {
            dist: proj.dist,
            progressed,
            remaining: Math.max(0, total - progressed),
            nearestIndex: i
          };
        }
        walkedBefore += segLen;
      }
      return { ...best, progress: Math.max(0, Math.min(1, best.progressed / total)) };
    }

    function estimateSafetyScore(route, kind, mode = 'foot') {
      const distanceKm = route.distance / 1000;
      const durationMin = route.duration / 60;
      let base = mode === 'car' ? 70 : mode === 'foot' ? 76 : 82;
      if (kind === 'balanced') base += 6;
      if (kind === 'short') base -= mode === 'car' ? 10 : mode === 'foot' ? 14 : 16;
      if (kind === 'safe') base += mode === 'car' ? 10 : mode === 'foot' ? 14 : 16;
      const distancePenalty = Math.min(8, Math.round(distanceKm * 1.5));
      const durationPenalty = Math.min(6, Math.round(durationMin / 12));
      const score = Math.max(45, Math.min(96, base - distancePenalty - durationPenalty + (kind === 'safe' ? 4 : 0)));
      const reasons = [];
      const meta = modeMeta(mode);
      if (kind === 'safe') reasons.push(`${meta.label} 기준으로 밝고 넓은 구간을 우선 고려`);
      if (kind === 'balanced') reasons.push(`${meta.label} 기준 안전성과 이동 시간의 균형을 반영`);
      if (kind === 'short') reasons.push(`${meta.label} 기준 최단 이동 시간 중심으로 계산`);
      reasons.push('출발지와 목적지를 새로 입력할 때마다 경로를 다시 계산');
      reasons.push('야간 귀가 상황을 고려한 위험도 안내 제공');
      const factors = [
        { label:'가로등 구간', state: kind !== 'short' ? '우수' : '보통' },
        { label:'CCTV 인접성', state: kind === 'safe' ? '우수' : '양호' },
        { label: mode === 'car' ? '차도/자동차 도로 접근성' : mode === 'sidewalk' ? '인도/횡단보도 적합성' : '일반 보행로 적합성', state: kind === 'safe' ? '양호' : '보통' },
        { label:'골목 비율', state: kind === 'short' ? '높음' : '낮음' }
      ];
      return { score, reasons, factors };

    function decodePolyline(str, precision = 5) {
      let index = 0, lat = 0, lng = 0, coordinates = [], factor = Math.pow(10, precision);
      while (index < str.length) {
        let b, shift = 0, result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        let dlat = result & 1 ? ~(result >> 1) : result >> 1; lat += dlat;
        shift = 0; result = 0;
        do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        let dlng = result & 1 ? ~(result >> 1) : result >> 1; lng += dlng;
        coordinates.push([lat / factor, lng / factor]);
      }
      return coordinates;
    }

    async function searchPlaceSuggestions(query, limit = 6) {

        try {
          const ps = new kakao.maps.services.Places();
          ps.keywordSearch(keyword, (data, status) => {
            if (status === kakao.maps.services.Status.OK && data && data.length) {
              const normalized = data.slice(0, limit).map(item => ({
                lat: Number(item.y),
                lon: Number(item.x),
                label: item.road_address_name || item.address_name || item.place_name,
                name: item.place_name || keyword,
                type: item.category_group_name || item.category_name?.split('>').pop()?.trim() || '카카오맵 장소',
                phone: item.phone || '',
                placeUrl: item.place_url || '',
                source: 'kakao'
              })).filter(place => Number.isFinite(place.lat) && Number.isFinite(place.lon));
              resolve(normalized);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
              resolve([]);
            } else {
              reject(new Error('카카오맵 장소 검색에 실패했습니다: ' + status));

    function reverseGeocode(lat, lon) {
      return new Promise(resolve => {
        ensureKakaoReady().then(() => {
          const geocoder = new kakao.maps.services.Geocoder();
          const coord = new kakao.maps.LatLng(lat, lon);
          // 1차: 도로명/지번 주소
          geocoder.coord2Address(lon, lat, (result, status) => {
            if (status === kakao.maps.services.Status.OK && result[0]) {
              const road = result[0].road_address;
              const jibun = result[0].address;
              // 도로명 있으면 도로명, 없으면 지번
              const addr = road
                ? `${road.region_1depth_name} ${road.region_2depth_name} ${road.road_name} ${road.main_building_no}${road.sub_building_no ? '-'+road.sub_building_no : ''}`
                : jibun
                ? `${jibun.region_1depth_name} ${jibun.region_2depth_name} ${jibun.region_3depth_name}`
                : null;
              if (addr) { resolve(addr.trim()); return; }
            }
            // 2차: 행정구역
            geocoder.coord2RegionCode(lon, lat, (r2, s2) => {
              if (s2 === kakao.maps.services.Status.OK && r2[0]) {
                resolve(r2[0].address_name || '현재 위치');
              } else {
                resolve('현재 위치');
              }
            });
          });
        }).catch(() => resolve('현재 위치'));
      });
    }

    function isPedestrianMode(mode) {
      return normalizeTravelMode(mode) !== 'car';
    }

    function makePedestrianDisplayGeometry(geometry, mode) {
      // OSRM의 foot 경로는 실제 보행자 네트워크를 사용해도 지도에서는 도로 중심선 위에 그려지는 경우가 많습니다.
      // 사용자가 인도/도보 모드를 차도 경로로 오해하지 않도록, 화면 표시용 선만 살짝 인도 방향으로 평행 이동합니다.
      // 남은 거리 계산과 경로 진행률은 rawGeometry 원본 좌표를 계속 사용합니다.
      if (!isPedestrianMode(mode) || !Array.isArray(geometry) || geometry.length < 2) return geometry || [];
      const offsetMeters = mode === 'sidewalk' ? 8 : 6;
      return geometry.map((point, index) => {
        const prev = geometry[Math.max(0, index - 1)];
        const next = geometry[Math.min(geometry.length - 1, index + 1)];
        const lat = Number(point[0]);
        const lon = Number(point[1]);
        const metersPerLat = 111320;
        const metersPerLon = Math.max(1, 111320 * Math.cos(lat * Math.PI / 180));
        const dx = (Number(next[1]) - Number(prev[1])) * metersPerLon;
        const dy = (Number(next[0]) - Number(prev[0])) * metersPerLat;
        const len = Math.hypot(dx, dy) || 1;
        const perpX = -dy / len;
        const perpY = dx / len;
        return [
          lat + (perpY * offsetMeters) / metersPerLat,
          lon + (perpX * offsetMeters) / metersPerLon
        ];
      });
    }

    function routeModeBadgeText(route) {
      const mode = normalizeTravelMode(route?.mode || state.travelMode);
      if (mode === 'car') return '🚗 차도 전용 경로';
      if (mode === 'foot') return '🚶 도보 전용 경로';
      return '🟢 인도 우선 경로';
    }

    // ORS(OpenRouteService) - 실제 인도/보행자 도로 네트워크 사용
    // OSRM foot 프로파일은 도로 중심선 위에 경로를 그려 차도처럼 보이는 문제가 있어
    // 보행자 모드는 ORS foot-walking 프로파일로 전환합니다.
    const ORS_API_KEY = '5b3ce3597851110001cf624801c7d2db0e554b0580d7ce7c74e15e0c'; // 공개 데모 키

    async function fetchRouteORS(start, end, orsProfile) {
      // ORS GeoJSON 방식으로 요청 (인도/보행자 실제 네트워크 사용)
      const url = `https://api.openrouteservice.org/v2/directions/${orsProfile}/geojson`;
      const body = {
        coordinates: [[start.lon, start.lat], [end.lon, end.lat]],
        alternative_routes: { target_count: 3, weight_factor: 1.6, share_factor: 0.6 },
        instructions: false,
        preference: 'recommended'
      };
      const controller = new AbortController();
      const orsTimeout = setTimeout(() => controller.abort(), 10000);
      let res;
      try {
        res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': ORS_API_KEY
          },
          body: JSON.stringify(body),
          signal: controller.signal
        });
      } finally {
        clearTimeout(orsTimeout);
      }
      if (!res.ok) {
        let errMsg = '';
        try {
          const errData = await res.json();
          errMsg = errData?.error?.message || errData?.message || JSON.stringify(errData).slice(0,100);
        } catch(e) {
          errMsg = await res.text().catch(() => '').then(t => t.slice(0,120));
        }
        throw new Error(`ORS 경로 연결 실패 (${res.status}): ${errMsg}`);
      }
      const data = await res.json();
      if (!data.features || !data.features.length) throw new Error('ORS 경로를 찾을 수 없음 (features 없음)');
      // ORS GeoJSON → OSRM-호환 형태로 변환
      const routes = data.features.map(feature => {
        // ORS v2 GeoJSON: summary는 properties.summary 또는 properties.segments[0]에 있음
        const props = feature.properties?.summary
          || (feature.properties?.segments?.[0])
          || {};
        const dist = props.distance || feature.properties?.distance || 0;
        const dur = props.duration || feature.properties?.duration || 0;
        // ORS 좌표는 [lon, lat] 순서 → [lat, lon]으로 변환
        const coords = (feature.geometry?.coordinates || []).map(c => [c[1], c[0]]);
        return {
          distance: dist,
          duration: dur,
          geometry: coords,
          _orsDecoded: true
        };
      }).filter(r => r.geometry.length >= 2);
      if (!routes.length) throw new Error('ORS 유효한 경로 좌표가 없습니다');
      return routes;
    }

    async function fetchRouteOSRM(start, end, profile) {
      const url = `https://router.project-osrm.org/route/v1/${profile}/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=polyline&alternatives=true&steps=false`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`OSRM 경로 연결 실패`);
      const data = await res.json();
      if (!data.routes || !data.routes.length) throw new Error(`OSRM 경로를 찾을 수 없음`);
      return data.routes;
    }

    async function fetchRoute(start, end, mode = 'foot') {
      const lockedMode = normalizeTravelMode(mode);
      const meta = modeMeta(lockedMode);
      const profile = meta.primaryProfile;
      try {
        if (lockedMode === 'car') {
          // 차도: OSRM driving 사용
          const routes = await fetchRouteOSRM(start, end, 'driving');
          return { routes, usedProfile: 'driving', lockedMode };
        } else {
          // 인도 우선 / 일반 도보: ORS foot-walking 사용 (실제 인도 네트워크)
          const orsProfile = 'foot-walking';
          let routes;
          try {
            routes = await fetchRouteORS(start, end, orsProfile);
          } catch (orsErr) {
            // ORS 실패 시 OSRM foot으로 폴백 (경고 포함)
            console.warn('ORS 실패, OSRM foot으로 대체:', orsErr.message);
            const osrmRoutes = await fetchRouteOSRM(start, end, 'foot');
            return { routes: osrmRoutes, usedProfile: 'foot', lockedMode, fallbackNotice: 'ORS 서버 연결 실패로 OSRM foot 경로를 사용했습니다. 실제 인도 경로와 다를 수 있습니다.' };
          }
          return { routes, usedProfile: profile, lockedMode };
        }
      } catch (e) {
        const target = lockedMode === 'car' ? '차도/자동차 도로' : '인도·횡단보도·보행자길';
        const detail = e.message || '';
        throw new Error(`${meta.label} 기준의 ${target} 경로를 찾지 못했습니다.${detail ? ' (' + detail + ')' : ''} 출발지/목적지를 더 구체적으로 입력하거나 다른 지점을 선택해보세요.`);
      }
    }
    function buildRouteVariants(routes, mode = 'foot', usedProfile = '') {
      mode = normalizeTravelMode(mode);
      const sorted = [...routes].sort((a,b) => adjustedDuration(a, mode, usedProfile) - adjustedDuration(b, mode, usedProfile));
      const shortest = sorted[0];
      const longest = sorted[sorted.length - 1];
      const middle = sorted[Math.floor(sorted.length / 2)] || shortest;
      const meta = modeMeta(mode);
      const unique = [
        { raw: longest || shortest, kind:'safe', name:'추천 안전 경로' },
        { raw: middle || shortest, kind:'balanced', name:'균형 경로' },
        { raw: shortest, kind:'short', name:'최단 경로' }
      ].filter((item, idx, arr) => arr.findIndex(v => v.raw && v.raw.geometry === item.raw.geometry) === idx);
      return unique.map((item, idx) => {
        const duration = adjustedDuration(item.raw, mode, usedProfile);
        const safe = estimateSafetyScore({ ...item.raw, duration }, item.kind, mode);
        const guide = modeGuide(mode);
        const fallbackNotice = [
          `길 안내 타입 고정: ${guide.guideType}`,
          `이동 위치: ${guide.guideSurface}`,
          `제외 설정: ${guide.guideAvoid}`,
          mode !== 'car'
            ? `예상 도착 시간은 ${guide.label} 평균 속도 ${guide.kmh}km/h 기준으로 별도 계산`
            : '예상 도착 시간은 차도/자동차 도로 API의 주행 시간 기준으로 계산',
          `실제 지도 요청 기준: ${guide.primaryProfile}`,
          mode !== 'car'
            ? '자동차 차도 경로로 대체하지 않고 보행자 경로만 사용'
            : '보행자 인도 경로로 대체하지 않고 자동차 도로 경로만 사용' 
        ];
        // ORS는 이미 디코딩된 좌표 배열을 반환, OSRM은 인코딩된 polyline 문자열을 반환
        const rawGeometry = item.raw._orsDecoded
          ? (Array.isArray(item.raw.geometry) ? item.raw.geometry : [])
          : decodePolyline(item.raw.geometry);
        // ORS foot-walking은 실제 인도 네트워크를 사용하므로 시각적 오프셋 불필요
        const displayGeometry = (isPedestrianMode(mode) && !item.raw._orsDecoded)
          ? makePedestrianDisplayGeometry(rawGeometry, mode)
          : rawGeometry;
        return {
          id: idx + 1,
          name: item.name,
          mode,
          modeLabel: modeLabel(mode),
          guideType: guide.guideType,
          guideSurface: guide.guideSurface,
          guideAvoid: guide.guideAvoid,
          usedProfile: usedProfile || guide.primaryProfile,
          eta: formatDuration(duration),
          distance: formatDistance(item.raw.distance),
          durationSeconds: duration,
          distanceMeters: item.raw.distance,
          score: safe.score,
          reasons: [...fallbackNotice, ...safe.reasons],
          factors: safe.factors,
          geometry: rawGeometry,
          rawGeometry,
          displayGeometry,
          routeSourceProfile: usedProfile || guide.primaryProfile,
          visualNotice: isPedestrianMode(mode) ? (item.raw._orsDecoded ? 'ORS foot-walking 프로파일로 실제 인도·보행자 도로 네트워크 경로를 사용합니다.' : 'OSRM foot 경로를 사용합니다. 실제 인도와 다소 차이가 있을 수 있습니다.') : '차도 모드는 자동차 도로 경로만 요청합니다.'
        };
      });
    }

            </div>
            <div class="suggestion-card">

        <div class="space-y">
          <div class="card">
            <h3>선택 경로 상세</h3>
            ${route ? routeDetailHTML(route) : '<div class="mini-card" style="background:#f8fafc">출발지와 목적지를 입력하고 <strong>안전 경로 찾기</strong> 버튼을 누르면 이곳에 안전 점수와 추천 근거가 표시됩니다.</div>'}

              <div class="mini-card">CCTV 및 감시 인프라 접근성 고려</div>

    function routeOptionHTML(route) {
      const [text, tone] = scoreLabel(route.score);

    }

    function routeDetailHTML(route) {
      const [text, tone] = scoreLabel(route.score);
      return `
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div><strong style="font-size:18px">${route.modeLabel || modeLabel(state.travelMode)} · ${route.name}</strong><div class="small muted">예상 ${route.eta} · ${route.distance}</div></div>
          <span class="badge ${tone}">${text}</span>

    function navigationSteps(route) {
      if (!route) return [];
      const meta = modeGuide(route.mode || state.travelMode);
      const destination = state.latestDestination || '목적지';
      const safetyHint = route.score < 70
        ? '주의 구간이 있을 수 있으니 위치 공유를 유지하고 밝은 큰길을 우선하세요.'
        : '현재 경로는 안전도가 양호합니다. 그래도 주변을 확인하며 이동하세요.';
      const modeHint = route.mode === 'car'
        ? '차도/자동차 도로 안내입니다. 인도나 보행자 전용길이 아니라 자동차가 다니는 도로 기준으로 이동하세요.'
        : route.mode === 'sidewalk'
          ? '인도 우선 안내입니다. 차도로 내려가지 말고 인도, 횡단보도, 보행자길을 따라 이동하세요.'
          : '일반 도보 안내입니다. 자동차 차도가 아니라 사람이 걸을 수 있는 보행 가능한 길을 기준으로 이동하세요.';
      return [
        `${meta.icon} ${meta.guideType}를 시작합니다. ${route.name} 기준으로 ${destination}까지 이동합니다.`,
        `안내 대상은 “${meta.guideSurface}”입니다. ${modeHint}`,
        `출발 후 약 ${Math.max(1, Math.round(route.durationSeconds / 60 / 4))}분 동안 현재 경로를 따라 이동하세요. 안내 제외 대상: ${meta.guideAvoid}.`,
        `중간 구간입니다. 예상 전체 거리 ${route.distance}, 남은 시간은 앱의 예상 시간 ${route.eta}를 기준으로 확인하세요.`,
        `${safetyHint} 경로를 벗어난 느낌이 들면 현재 이동 기준을 다시 확인하고 경로를 다시 계산하세요.`,
        `목적지 근처입니다. 도착하면 안내 종료를 누르고 보호자에게 귀가 완료 상태를 확인시켜 주세요.`
      ];
    }

    function navigationPanelHTML(route) {
      const steps = navigationSteps(route);
      const current = Math.min(state.navigationStepIndex || 0, Math.max(0, steps.length - 1));
      const metrics = navigationMetrics(route);
      const distanceProgress = state.navigationActive ? Math.round((metrics.progress || state.navigationProgress || 0) * 100) : 0;
      const progress = state.navigationActive ? distanceProgress : (steps.length ? Math.round(((current + 1) / steps.length) * 100) : 0);
      const remaining = state.navigationActive
        ? formatDistance(state.navigationRemainingMeters ?? metrics.remaining ?? route.distanceMeters)
        : route.distance;
      return `
        <div class="navigation-panel ${state.navigationActive ? 'active' : ''}">
          <div class="navigation-head">
            <div>
              <strong>실시간 네비 안내</strong>
              <div class="small muted" style="margin-top:5px">프로젝트 디자인 2 기준으로 카카오맵, 연관검색어, 위치 기반 남은 거리 갱신을 적용했습니다.</div>
            </div>
            <span class="badge ${state.navigationActive ? 'safe' : ''}">${state.navigationActive ? '안내 중' : '대기 중'}</span>
          </div>
          <div style="margin-top:12px">
            <div class="row" style="justify-content:space-between">
              <span class="small">안내 진행률</span>
              <strong>${progress}%</strong>
            </div>
            <div class="progress" style="margin-top:8px"><div style="width:${progress}%"></div></div>
            <div style="margin-top:10px"><span class="remaining-chip">남은 거리 ${remaining}</span></div>
          </div>
          <div class="navigation-instruction">${steps[current] || '경로를 선택하면 안내가 표시됩니다.'}</div>
          <div class="navigation-controls">
            <button id="prevNavigationStepBtn" class="secondary" ${!state.navigationActive || current <= 0 ? 'disabled' : ''}>이전 안내</button>
            <button id="nextNavigationStepBtn" ${!state.navigationActive ? 'disabled' : ''}>다음 안내</button>
            <button id="stopNavigationBtn" class="stop" ${!state.navigationActive ? 'disabled' : ''}>안내 종료</button>
          </div>
          <div class="nav-step-list">
            ${steps.map((step, idx) => `<div class="nav-step ${idx === current ? 'current' : ''}">${idx + 1}. ${step}</div>`).join('')}
          </div>
        </div>`;
    }

    function nextNavigationStep() {
      const route = selectedRoute();
      if (!route) return;
      const max = navigationSteps(route).length - 1;
      setState({ navigationStepIndex: Math.min(max, (state.navigationStepIndex || 0) + 1) });
    }

    function prevNavigationStep() {
      setState({ navigationStepIndex: Math.max(0, (state.navigationStepIndex || 0) - 1) });
    }

    function stopNavigation() {
      stopNavigationWatch();
      setState({ navigationActive:false, tripActive:false, navigationStepIndex:0, navigationStartedAt:null, navigationRemainingMeters:null, navigationProgress:0 });
    }

                  <div><strong>${escapeHTML(c.name)}</strong> <span class="small muted">${escapeHTML(c.relation)}</span></div>
                  <div style="display:flex;gap:8px">
                    <button onclick="window.open('sms:${c.phone.replace(/-/g,'')}?body=${msg}','_blank')" style="padding:7px 10px;font-size:12px">문자 전송</button>

    // 연결된 피보호자 데이터 가져오기
    function getWardData() {
      if (!state.user?.linkedUserId) return null;
      const users = load(USERS_KEY, defaultUsers);
      return users.find(u => u.id === state.user.linkedUserId) || null;
    }

    // 피보호자의 공유 데이터 읽기 (피보호자 계정 userKey 기반)
    function getWardSharedState() {
      const ward = getWardData();
      if (!ward) return null;

        sharing: wardLoad('sharing', defaultShare),

        sosSent: wardLoad('sos_sent', false),

    function aiRiskPrediction(route = selectedRoute()) {
      const hour = new Date().getHours();
      const nightBonus = hour >= 22 || hour <= 5 ? 14 : hour >= 18 ? 7 : 0;
      let risk = route ? Math.max(8, 100 - route.score) : 42;
      if (!state.sharing.enabled) risk += 10;
      if (!state.currentLocation) risk += 5;
      if (state.batteryLevel < 30) risk += 14;
      if ((route?.mode || state.travelMode) === 'foot') risk += nightBonus;
      if ((route?.mode || state.travelMode) === 'sidewalk') risk += Math.round(nightBonus * 0.8);
      if (state.sosSent) risk += 20; // SOS 발송 시 위험도 상향
      risk = Math.max(0, Math.min(100, Math.round(risk)));
      const level = risk >= 70 ? '높음' : risk >= 45 ? '중간' : '낮음';
      const badgeClass = risk >= 70 ? 'warn' : risk >= 45 ? 'mid' : 'safe';
      const best = state.routes.length ? [...state.routes].sort((a,b) => b.score - a.score)[0] : route;
      const action = risk >= 70
        ? '밝은 큰길로 우회하고, 위치 공유와 SOS 버튼을 켜둔 상태로 이동하세요.'
        : risk >= 45
          ? '추천 안전 경로를 우선 선택하고 보호자에게 예상 도착 시간을 공유하세요.'
          : '현재 상태는 안정적입니다. 그래도 귀가 시작 버튼과 위치 공유를 함께 사용하는 것이 좋습니다.';
      const prediction = best
        ? `${best.name}이 현재 조건에서 가장 안전할 가능성이 높습니다. 안전점수 ${best.score}점, 예상 ${best.eta}입니다.`
        : '아직 계산된 경로가 없어 기본 위험도만 예측했습니다. 안전 경로 탭에서 출발지와 목적지를 입력하면 경로별로 다시 판단합니다.';
      return { risk, level, badgeClass, action, prediction, recommendedRoute: best };
    }

    function aiAnomalyDetection() {
      const route = selectedRoute();
      const elapsedSec = state.navigationStartedAt ? Math.max(0, Math.round((Date.now() - new Date(state.navigationStartedAt).getTime()) / 1000)) : 0;
      const lateAtNight = (() => { const h = new Date().getHours(); return h >= 22 || h <= 5; })();
      const signals = [
        {
          label: '장시간 정지',
          state: state.tripActive && elapsedSec > 600 && state.navigationStepIndex <= 1 ? '주의' : state.tripActive ? '모니터링 중' : '대기',
          detail: '귀가 시작 후 같은 안내 단계에 오래 머무르면 정지 가능성을 감지합니다.'
        },
        (() => {
          let devState = '경로 없음';
          let devDetail = '경로를 선택하면 이탈 감지가 시작됩니다.';
          if (route && state.currentLocation) {
            const metrics = navigationMetrics(route, state.currentLocation);
            // nearestIndex 기준으로 경로와의 거리 계산
            const geom = routeMetricGeometry(route);
            if (geom.length >= 2) {
              const nearest = geom[Math.min(metrics.nearestIndex || 0, geom.length - 1)];
              const distToRoute = distanceBetween(state.currentLocation, nearest);
              if (distToRoute > 80) {
                devState = `이탈 감지 (${Math.round(distToRoute)}m 벗어남)`;
                devDetail = `경로에서 약 ${Math.round(distToRoute)}m 벗어났습니다. 경로를 다시 확인하세요.`;
              } else {
                devState = `정상 (경로 ${Math.round(distToRoute)}m 이내)`;
                devDetail = '현재 위치가 선택 경로 근처에 있습니다.';
              }
            } else {
              devState = '모니터링 중';
              devDetail = '경로 좌표를 확인 중입니다.';
            }
          } else if (route) {
            devState = '모니터링 중';
            devDetail = '위치 권한을 허용하면 실시간 이탈 감지가 가능합니다.';
          }
          return { label: '경로 이탈', state: devState, detail: devDetail };
        })(),
        {
          label: '비정상 속도 변화',
          state: state.tripActive && lateAtNight && !state.sharing.enabled ? '확인 필요' : '정상',
          detail: '인도 우선·일반 도보·차도 기준 예상 속도와 실제 이동 흐름이 크게 다르면 알림을 띄웁니다.'
        }
      ];
      const warnCount = signals.filter(s => s.state.includes('주의') || s.state.includes('확인') || s.state.includes('이탈 감지')).length;
      const score = Math.min(100, warnCount * 35 + (state.sosSent ? 30 : 0));
      const level = score >= 70 ? '위험' : score >= 35 ? '주의' : state.tripActive ? '정상 모니터링' : '대기';
      const badgeClass = score >= 70 ? 'warn' : score >= 35 ? 'mid' : 'safe';
      return { signals, score, level, badgeClass };
    }

    function aiPersonalSafetyAlert() {
      const route = selectedRoute();
      const hour = new Date().getHours();
      const night = hour >= 18 || hour <= 5;
      const matchedFavorite = state.favorites.find(f => {
        const target = (state.latestDestination || '').replace(/\s+/g, '').toLowerCase();
        const addr = (f.address || '').replace(/\s+/g, '').toLowerCase();
        const label = (f.label || '').replace(/\s+/g, '').toLowerCase();
        if (!target || target.length < 2) return false;
        return addr.includes(target) || target.includes(addr) || label.includes(target) || target.includes(label);
      });
      const title = night ? '야간 귀가 맞춤 알림' : '사전 귀가 준비 알림';
      const tips = [];
      if (matchedFavorite) tips.push(`자주 가는 장소 “${matchedFavorite.label}” 방향으로 인식했습니다.`);
      if (route) tips.push(`${route.name} 기준 안전점수는 ${route.score}점입니다.`);
      if (!state.sharing.enabled) tips.push('위치 공유가 꺼져 있어 보호자 공유를 켜는 것을 추천합니다.');
      if (state.batteryLevel < 40) tips.push(`배터리가 ${state.batteryLevel}%라서 이동 전 충전을 권장합니다.`);
      if (!tips.length) tips.push('현재 설정은 안정적입니다. 귀가 시작 후 보호자 화면에서 상태를 확인할 수 있습니다.');
      const message = `${state.user?.name || '사용자'}님에게 맞춘 알림입니다. ${tips[0]}`;
      return { title, message, tips };
    }

        .replace(/'/g, '&#039;');

    function routeRiskLevel(score) {
      if (score >= 85) return '안전도가 높은 편입니다';
      if (score >= 70) return '대체로 안전하지만 주변 확인이 필요합니다';
      if (score >= 55) return '보통 수준이라 밝은 큰길 위주로 이동하는 것이 좋습니다';
      return '주의가 필요한 경로입니다. 가능하면 다른 경로를 선택하거나 보호자 공유를 켜세요';
    }

    function routeAnalysisText(route) {
      if (!route) {
        return '아직 분석할 경로가 없어요. 안전 경로 탭에서 출발지와 목적지를 입력하고 “안전 경로 찾기”를 먼저 눌러주세요. 그다음 저에게 “이 경로 안전해?”라고 물어보면 현재 선택된 경로를 분석해드릴게요.';
      }
      const [label] = scoreLabel(route.score);
      const factors = route.factors.map(f => `- ${f.label}: ${f.state}`).join('\n');
      const reasons = route.reasons.map(r => `- ${r}`).join('\n');
      return `${route.modeLabel || modeLabel(state.travelMode)} · ${route.name} 분석 결과입니다.\n\n안전점수: ${route.score}/100 (${label})\n이동 기준: ${route.modeLabel || modeLabel(state.travelMode)}\n예상 이동: ${route.distance}, ${route.eta}\n판단: ${routeRiskLevel(route.score)}\n\n주요 근거\n${reasons}\n\n세부 요소\n${factors}\n\n추천 행동: ${route.score < 70 ? '위치 공유를 켜고, 가능하면 추천 안전 경로나 균형 경로를 선택하세요.' : '현재 경로로 이동해도 괜찮지만, 귀가 시작 버튼을 누르고 위치 공유를 켜는 것을 권장해요.'}`;
    }

    function compareRoutesText() {
      if (!state.routes.length) {
        return '비교할 경로가 아직 없어요. 안전 경로 탭에서 목적지를 입력하고 인도 우선/일반 도보/차도 중 이동 기준을 선택해 경로를 계산하면 추천 안전 경로, 균형 경로, 최단 경로를 안전점수 기준으로 비교해드릴 수 있어요.';
      }
      const ranked = [...state.routes].sort((a,b) => b.score - a.score);
      const lines = ranked.map((r, i) => `${i+1}. ${r.modeLabel || modeLabel(state.travelMode)} ${r.name}: ${r.score}점, ${r.distance}, ${r.eta} — ${routeRiskLevel(r.score)}`).join('\n');
      const best = ranked[0];
      const fastest = [...state.routes].sort((a,b) => a.durationSeconds - b.durationSeconds)[0];
      return `경로 비교 결과입니다.\n\n${lines}\n\n추천: 밤길 귀가라면 “${best.name}”이 가장 적합해요. ${fastest && fastest.id !== best.id ? `가장 빠른 경로는 “${fastest.name}”이지만 안전점수는 ${fastest.score}점입니다.` : '가장 빠른 경로와 안전한 경로가 크게 다르지 않아요.'}`;
    }

    function destinationHelpText(message) {

${route ? `현재 선택된 경로는 ${route.modeLabel || modeLabel(state.travelMode)} ${route.name}, 안전점수 ${route.score}점입니다. “이 경로 안전해?”라고 물어보면 바로 분석해드릴게요.` : '아직 선택된 경로가 없어요. 안전 경로 탭에서 목적지를 입력하면 제가 그 경로를 분석해드릴게요.'}`;
    }

    function selfAIThinkingText(message) {
      const text = normalizeChatText(message);
      const route = selectedRoute();
      const riskWords = [
        ['불안', 12], ['무서', 15], ['어둡', 14], ['골목', 12], ['혼자', 10],
        ['따라', 25], ['쫓', 25], ['위험', 18], ['배터리', 8], ['길잃', 10]
      ];
      let risk = route ? Math.max(0, 100 - route.score) : 35;
      const detected = [];
      riskWords.forEach(([word, point]) => {
        if (text.includes(word)) {
          risk += point;
          detected.push(word);
        }
      });
      if (!state.sharing.enabled) risk += 10;
      if (state.batteryLevel < 30) risk += 10;
      risk = Math.max(0, Math.min(100, risk));
      const level = risk >= 70 ? '높음' : risk >= 45 ? '중간' : '낮음';
      const action = risk >= 70
        ? '지금은 안전 행동을 우선해야 합니다. 밝은 상가·편의점·지구대 쪽으로 이동하고, 필요하면 즉시 112 신고와 SOS를 사용하세요.'
        : risk >= 45
          ? '주의가 필요한 상황입니다. 위치 공유를 켜고 큰길 위주로 이동하며, 경로를 다시 비교하는 것을 추천합니다.'
          : '현재 판단으로는 비교적 안정적인 상태입니다. 그래도 밤길에서는 위치 공유와 귀가 시작을 켜두는 것이 좋습니다.';
      return `자체 AI 판단 결과입니다.

분석한 상황: ${detected.length ? detected.join(', ') : '일반 밤길 귀가 질문'}
위험도 판단: ${level} (${risk}/100)
현재 경로: ${route ? `${route.modeLabel || modeLabel(state.travelMode)} ${route.name}, 안전점수 ${route.score}점` : '선택된 경로 없음'}
위치 공유: ${state.sharing.enabled ? 'ON' : 'OFF'}
배터리: ${state.batteryLevel}%

AI 추천
${action}

바로 할 수 있는 명령: “위치 공유 켜줘”, “현재 경로 분석해줘”, “SOS 문구 만들어줘”, “경로 비교해줘”`;
    }

- 🟢 인도 우선: 밤길 안전 귀가 기본값입니다. 차도가 아니라 인도, 횡단보도, 보행자길 중심으로 안내합니다.

- 🚗 차도: 자동차가 이동하는 차도/자동차 도로 기준입니다. 보행자 인도 안내가 아닙니다.

현재 선택 기준은 ${modeLabel(state.travelMode)}입니다. “인도 우선으로 바꿔줘”, “도보로 바꿔줘”, “차도 기준으로 바꿔줘”라고 말하면 기준을 바꿔둘게요.`;

위치 공유: ${state.sharing.enabled ? '켜짐' : '꺼짐'}
배터리: ${state.batteryLevel}%

추천 행동

    function appUsageText() {
      return `이 사이트에서 제가 도와줄 수 있는 AI 기능입니다.

외부 대화 API 없이 브라우저 안의 자체 AI 판단 엔진으로 작동하도록 구성했습니다. 사용자의 문장에서 인사, 불안, 위험, 경로, 위치공유, 이동수단, SOS 의도를 분류하고 현재 사이트 상태를 함께 계산해 답변합니다.`;
    }

    function normalizeChatText(message) {
      return message
        .toLowerCase()
        .replace(/\s+/g, '')
        .replace(/[.,!?~]/g, '')
        .replace(/안저|안전도|안저도|안전저/g, '안전')
        .replace(/경로우|겅로|경ㄹ|길/g, '경로')
        .replace(/인도|보도|보행자길|횡단보도|보행자전용/g, '인도')
        .replace(/도보오|걸어서|걷는|보행/g, '도보')
        .replace(/차도|자동차도로|자동차|운전|차량/g, '차도')
        .replace(/인도어|바이크|싸이클/g, '인도')
        .replace(/공유우|공ㅇ유|위치공유좀|위치공ㅇ/g, '공유')
        .replace(/보호쟈|보호저|보호자한테/g, '보호자')
        .replace(/긴그|긴급ㅅ|위그|위급ㅅ/g, '긴급')
        .replace(/쏘스|에스오에스|s0s/g, 'sos')
        .replace(/쳌|채크|체크크/g, '체크')
        .replace(/비굑|비교오|비교해조/g, '비교')
        .replace(/켜조|켜줘요|켜죠/g, '켜줘')
        .replace(/꺼조|꺼줘요|꺼죠/g, '꺼줘');
    }

    function hasAny(text, keywords) {
      return keywords.some(keyword => text.includes(keyword));
    }

    function editDistance(a, b) {
      if (!a || !b) return Math.max(a.length, b.length);
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }
      }
      return dp[a.length][b.length];
    }

    function fuzzyHas(text, keywords) {
      if (hasAny(text, keywords)) return true;
      const chunks = text.match(/[가-힣a-z0-9]+/g) || [];
      return chunks.some(chunk => keywords.some(keyword => {
        const limit = keyword.length <= 2 ? 1 : 2;
        return editDistance(chunk, keyword) <= limit;
      }));
    }

    function getChatbotReply(message) {
      const text = normalizeChatText(message);
      const original = message.toLowerCase();
      const wantsShare = fuzzyHas(text, ['공유', '위치공유', '위치']);
      const wantsRoute = fuzzyHas(text, ['경로', '안전', '안전해', '위험', '위험해']);
      const wantsOn = hasAny(text, ['켜', 'on', '온', '활성', '켜줘']);
      const wantsOff = hasAny(text, ['꺼', 'off', '오프', '비활성', '꺼줘']);
      const wantsMode = fuzzyHas(text, ['인도', '도보', '차도', '차', '이동기준', '기준']);

      if (hasAny(text, ['안녕', '하이', 'hello', 'hi', '반가워', 'ㅎㅇ', '안뇽', '안녕하세요'])) {
        return greetingText();
      }
      if (hasAny(text, ['생각해', '판단해', '자체ai', 'ai판단', '위험도판단'])) {
        return selfAIThinkingText(message);
      }
      if (hasAny(text, ['위험도예측', '위험예측', '안전경로추천', 'ai위험도'])) {
        return aiRiskPredictionText();
      }
      if (hasAny(text, ['이상행동', '장시간정지', '경로이탈', '속도변화', '감지결과'])) {
        return aiAnomalyDetectionText();
      }
      if (hasAny(text, ['맞춤형안전알림', '맞춤알림', '개인화', '사용자선호', '과거선택'])) {
        return aiPersonalSafetyAlertText();
      }

      if (hasAny(text, ['인도']) && (wantsMode || wantsRoute || hasAny(text, ['바꿔', '변경', '설정']))) {
        state.travelMode = 'sidewalk';
        state.routes = [];
        state.selectedRouteId = null;
        requestAnimationFrame(() => render());
        return '이동 기준을 🟢 인도 우선 보행으로 바꿨어요. 차도가 아니라 인도·횡단보도·보행자길 중심으로 안내합니다. 목적지를 다시 입력하고 안전 경로 찾기를 눌러주세요.';
      }
      if (hasAny(text, ['도보']) && (wantsMode || wantsRoute || hasAny(text, ['바꿔', '변경', '설정']))) {
        state.travelMode = 'foot';
        state.routes = [];
        state.selectedRouteId = null;
        requestAnimationFrame(() => render());
        return '이동 기준을 🚶 일반 도보로 바꿨어요. 자동차 차도가 아니라 사람이 걸을 수 있는 길 기준으로 새로 계산됩니다.';
      }
      if (hasAny(text, ['차도', '차']) && (wantsMode || wantsRoute || hasAny(text, ['바꿔', '변경', '설정']))) {
        state.travelMode = 'car';
        state.routes = [];
        state.selectedRouteId = null;
        requestAnimationFrame(() => render());
        return '이동 기준을 🚗 차도/자동차 도로로 바꿨어요. 인도 안내가 아니라 자동차 도로 기준으로 새로 계산됩니다.';
      }
      if (hasAny(text, ['인도'])) {
        return '이번 버전에서는 헷갈리지 않게 인도 우선, 일반 도보, 차도 세 가지만 사용하도록 정리했습니다. 현재 지원하지 않는 이동수단 대신 일반 도보 또는 차도 기준을 선택해주세요.';
      }
      if (wantsShare && wantsOn) {
        const next = { ...state.sharing, enabled: true, lastSentAt: timeNow() };
        saveU(SHARE_KEY, next);
        state.sharing = next;
        requestAnimationFrame(() => render());
        return '위치 공유를 ON으로 변경했어요. 보호자 화면에서 마지막 갱신 시간과 귀가 상태를 확인할 수 있습니다.';
      }
      if (wantsShare && wantsOff) {
        const next = { ...state.sharing, enabled: false, lastSentAt: timeNow() };
        saveU(SHARE_KEY, next);
        state.sharing = next;
        requestAnimationFrame(() => render());
        return '위치 공유를 OFF로 변경했어요. 밤길 이동 중이라면 다시 켜두는 것을 권장합니다.';
      }
      if (wantsMode || hasAny(text, ['인도도보차도', '도보차도', '이동수단'])) {
        return modeAdviceText();
      }
      if ((hasAny(text, ['현재', '선택', '이경로', '이길']) && wantsRoute) || hasAny(text, ['경로안전', '안전분석', '위험분석'])) {
        const r = selectedRoute();
        if (!r && state.routes.length === 0) {
          return '아직 계산된 경로가 없어요. 안전 경로 탭에서 출발지와 목적지를 입력한 뒤 "안전 경로 찾기" 버튼을 눌러주세요. 경로가 계산되면 바로 분석해드릴게요.';
        }
        return routeAnalysisText(r);
      }
      if (fuzzyHas(text, ['비교', '추천']) || hasAny(text, ['세개', '3개', '셋중'])) {
        return compareRoutesText();
      }
      if (fuzzyHas(text, ['체크', '준비']) || hasAny(text, ['귀가전', '챙길것', '확인할것'])) {
        return checklistText();
      }
      if (fuzzyHas(text, ['sos', '긴급', '신고', '위급'])) {
        const sosReply = sosText();
        return sosReply + '\n\nSOS 탭에서 112/119 직통 전화 버튼도 사용할 수 있어요.';
      }
      if (fuzzyHas(text, ['보호자'])) {
        return guardianSummaryText();
      }
      if (hasAny(text, ['사용법', '기능', '뭐할수', 'ai', '에이아이', '챗봇'])) {
        return appUsageText();
      }
      if (hasAny(text, ['불안', '무서', '따라', '쫓', '어둡', '골목', '혼자', '배터리'])) {
        return selfAIThinkingText(message);
      }
      if (wantsShare || fuzzyHas(text, ['위치'])) {
        return shareStatusText();
      }
      if (fuzzyHas(text, ['기록', '이력'])) {
        const latest = state.history[0];
        return latest ? `최근 귀가 기록입니다.

날짜: ${latest.date}
출발: ${latest.start}
도착/예상 도착: ${latest.end}
경로: ${latest.route}
목적지: ${latest.destination}
상태: ${latest.status}` : '아직 저장된 귀가 기록이 없습니다.';
      }
      if (hasAny(text, ['목적지', '가는경로', '가는길', '가도', '안전해']) || original.includes('가도 돼')) {
        return destinationHelpText(message);
      }
      return selfAIThinkingText(message);
    }

    function isChatbotNearBottom(box) {
      if (!box) return true;
      return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    }

    function addChatbotMessage(role, text) {
      state.chatbotMessages = [...state.chatbotMessages, { role, text }];
      const box = document.getElementById('aiChatbotMessages');
      if (!box) return;
      const shouldStayAtBottom = role === 'user' || isChatbotNearBottom(box);
      const msg = document.createElement('div');
      msg.className = role === 'user' ? 'user-message' : 'ai-message';
      msg.textContent = text;
      box.appendChild(msg);
      if (shouldStayAtBottom) box.scrollTop = box.scrollHeight;
    }

    function buildChatGPTContext() {
      const route = selectedRoute();
      return {
        service: '밤길 안전 귀가 서비스',
        travelMode: modeLabel(state.travelMode),
        selectedRoute: route ? {
          name: route.name,
          score: route.score,
          eta: route.eta,
          distance: route.distance,
          reasons: route.reasons,
          factors: route.factors
        } : null,
        sharing: state.sharing.enabled ? 'ON' : 'OFF',
        batteryLevel: state.batteryLevel,
        tripActive: state.tripActive,
        contactsCount: state.contacts.length
      };
    }

    async function requestChatGPTReply(message) {
      if (!state.chatgptEnabled || !state.chatgptEndpoint) return null;
      const res = await fetch(state.chatgptEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          context: buildChatGPTContext(),
          messages: state.chatbotMessages.slice(-8)
        })
      });
      if (!res.ok) throw new Error('ChatGPT 서버 연결 실패');
      const data = await res.json();
      return data.reply || data.message || data.text || null;
    }

    async function sendChatbotMessage(text) {
      const message = text.trim();
      if (!message) return;
      state.chatbotDraft = '';
      addChatbotMessage('user', message);
      // ChatGPT 연동 중일 때만 로딩 표시
      let loadingEl = null;
      if (state.chatgptEnabled && state.chatgptEndpoint) {
        const box = document.getElementById('aiChatbotMessages');
        if (box) {
          loadingEl = document.createElement('div');
          loadingEl.className = 'ai-message';
          loadingEl.textContent = '생각 중...';
          loadingEl.style.opacity = '0.5';
          box.appendChild(loadingEl);
          box.scrollTop = box.scrollHeight;
        }
      }
      try {
        const gptReply = await requestChatGPTReply(message);
        if (loadingEl) loadingEl.remove();
        addChatbotMessage('ai', gptReply || getChatbotReply(message));
      } catch (e) {
        if (loadingEl) loadingEl.remove();
        addChatbotMessage('ai', getChatbotReply(message) + '\n\n참고: ChatGPT 서버 연결에 실패해서 내부 AI 답변으로 응답했어요.');
      }
      if (['share','guardian','dashboard','ai'].includes(state.activeTab)) render();
    }

    function bindChatbot() {
      const fab = document.getElementById('aiChatbotFab');
      const win = document.getElementById('aiChatbotWindow');
      const close = document.getElementById('aiChatbotClose');
      const form = document.getElementById('aiChatbotForm');
      const input = document.getElementById('aiChatbotInput');
      const endpointInput = document.getElementById('chatgptEndpointInput');
      const saveEndpointBtn = document.getElementById('saveChatgptEndpointBtn');
      const enabledToggle = document.getElementById('chatgptEnabledToggle');
      if (!fab || !win) return;
      fab.addEventListener('click', (e) => {
        e.preventDefault();
        state.chatbotOpen = !state.chatbotOpen;
        win.classList.toggle('open', state.chatbotOpen);
        if (state.chatbotOpen) {
          input?.focus();
          const box = document.getElementById('aiChatbotMessages');
          if (box) box.scrollTop = box.scrollHeight;
        }
      });
      close?.addEventListener('click', (e) => {
        e.preventDefault();
        state.chatbotOpen = false;
        win.classList.remove('open');
      });
      input?.addEventListener('input', () => {
        state.chatbotDraft = input.value;
      });
      saveEndpointBtn?.addEventListener('click', () => {
        state.chatgptEndpoint = endpointInput?.value.trim() || '';
        localStorage.setItem(CHATGPT_ENDPOINT_KEY, state.chatgptEndpoint);
        addChatbotMessage('ai', state.chatgptEndpoint ? `ChatGPT 서버 주소를 저장했어요: ${state.chatgptEndpoint}` : 'ChatGPT 서버 주소를 비웠어요. 내부 AI로만 답변합니다.');
      });
      enabledToggle?.addEventListener('change', () => {
        state.chatgptEnabled = !!enabledToggle.checked;
        localStorage.setItem(CHATGPT_ENABLED_KEY, state.chatgptEnabled ? 'true' : 'false');
        addChatbotMessage('ai', state.chatgptEnabled ? 'ChatGPT 연동을 켰어요. 서버 주소가 연결되어 있으면 ChatGPT 답변을 우선 사용합니다.' : 'ChatGPT 연동을 껐어요. 사이트 내부 AI로 답변합니다.');
      });
      form?.addEventListener('submit', (e) => {
        e.preventDefault();
        sendChatbotMessage(input.value);
        input.value = '';
      });
      document.querySelectorAll('[data-ai-quick]').forEach(btn => {
        btn.addEventListener('click', () => sendChatbotMessage(btn.dataset.aiQuick || ''));
      });
    }

              new kakao.maps.CustomOverlay({ map, position: center, yAnchor: 2.4,
                content: `<div class="map-place-label">📍 ${escapeHTML(lastLoc.address || lastLoc.lat?.toFixed(4) + ', ' + lastLoc.lon?.toFixed(4))}</div>` });
              requestAnimationFrame(() => { try { map.relayout(); map.setCenter(center); } catch(e){} });
            } catch(e) {
              el.innerHTML = '<div class="alert">지도 로드 실패: ' + e.message + '</div>';
            }
          });
        }
      }

      // 설정 탭 - 연결하기 버튼
      if (state.activeTab === 'g_settings') {
        const linkBtn = document.getElementById('guardianLinkBtn');
        const linkErr = document.getElementById('guardianLinkError');
        if (linkBtn) linkBtn.addEventListener('click', () => {
          const code = (document.getElementById('guardianLinkInput')?.value || '').trim().toUpperCase();
          if (!code) { linkErr.textContent = '코드를 입력해주세요'; linkErr.classList.remove('hidden'); return; }
          const users = load(USERS_KEY, defaultUsers);
          const ward = users.find(u => u.linkCode === code && u.role !== 'guardian');
          if (!ward) { linkErr.textContent = '유효하지 않은 코드입니다. 피보호자에게 설정 탭에서 코드를 확인해달라고 하세요.'; linkErr.classList.remove('hidden'); return; }
          // 보호자 계정에 linkedUserId 저장
          const updatedUser = { ...state.user, linkedUserId: ward.id };
          const updatedUsers = users.map(u => u.id === state.user.id ? updatedUser : u);
          save(USERS_KEY, updatedUsers);
          save(SESSION_KEY, updatedUser);
          state.user = updatedUser;
          render();
        });
        const disconnectBtn = document.getElementById('disconnectWardBtn');

    function bindAuth() {
      const tabs = document.querySelectorAll('#authTabs button');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const authError = document.getElementById('authError');
      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          loginForm.classList.toggle('hidden', tab !== 'login');
          signupForm.classList.toggle('hidden', tab !== 'signup');
          authError.classList.add('hidden');
        });
      });
      // 역할 선택 라디오 버튼 UI 업데이트
      document.querySelectorAll('input[name="signupRole"]').forEach(radio => {
        radio.addEventListener('change', () => {
          const isGuardian = radio.value === 'guardian' && radio.checked;
          const codeWrap = document.getElementById('guardianCodeWrap');
          if (codeWrap) codeWrap.style.display = isGuardian ? 'block' : 'none';
          document.getElementById('roleUserLabel').style.borderColor = isGuardian ? '#e2e8f0' : '#1d4ed8';
          document.getElementById('roleUserLabel').style.background = isGuardian ? '#f8fafc' : '#eff6ff';
          document.getElementById('roleGuardianLabel').style.borderColor = isGuardian ? '#7c3aed' : '#e2e8f0';
          document.getElementById('roleGuardianLabel').style.background = isGuardian ? '#f5f3ff' : '#f8fafc';
        });
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const users = load(USERS_KEY, defaultUsers);
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const found = users.find(u => u.email === email && u.password === password);
        if (!found) {
          authError.textContent = '이메일 또는 비밀번호가 맞지 않습니다';
          authError.classList.remove('hidden');
          return;
        }
        save(SESSION_KEY, found);
        state.user = found;
        loadUserData();
        render();
        requestCurrentLocation();
      });
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const users = load(USERS_KEY, defaultUsers);
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        if (!name || !email || !password) {
          authError.textContent = '모든 항목을 입력해주세요';
          authError.classList.remove('hidden');
          return;
        }
        if (users.some(u => u.email === email)) {
          authError.textContent = '이미 등록된 이메일입니다';
          authError.classList.remove('hidden');
          return;
        }
        const roleEl = document.querySelector('input[name="signupRole"]:checked');
        const role = roleEl ? roleEl.value : 'user';
        let linkedUserId = null;
        if (role === 'guardian') {
          const code = (document.getElementById('signupLinkCode')?.value || '').trim().toUpperCase();
          if (!code) {
            authError.textContent = '피보호자 연결 코드를 입력해주세요. (피보호자 설정 탭에서 생성)';
            authError.classList.remove('hidden');
            return;
          }
          // 연결 코드로 피보호자 찾기
          const ward = users.find(u => u.linkCode === code);
          if (!ward) {
            authError.textContent = '연결 코드가 올바르지 않습니다. 피보호자에게 설정 탭에서 코드를 다시 확인해달라고 요청하세요.';
            authError.classList.remove('hidden');
            return;
          }
          linkedUserId = ward.id;
        }
        const created = { id:'user-' + Date.now(), name, email, password, role, linkedUserId };
        const next = [...users, created];
        save(USERS_KEY, next);
        save(SESSION_KEY, created);
        state.user = created;
        loadUserData();
        render();
        if (role !== 'guardian') requestCurrentLocation();
      });
    }


    function selectedPlaceFromInput(inputId) {
      const input = document.getElementById(inputId);
      if (!input || !input.dataset.lat || !input.dataset.lon) return null;
      const lat = Number(input.dataset.lat);
      const lon = Number(input.dataset.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      return {
        lat,
        lon,
        label: input.dataset.label || input.value,
        name: input.dataset.name || input.value
      };
    }

    function clearSelectedPlace(input) {
      if (!input) return;
      delete input.dataset.lat;
      delete input.dataset.lon;
      delete input.dataset.label;
      delete input.dataset.name;
    }

    function closePlaceSuggestions(box) {
      if (!box) return;
      box.classList.remove('open');
      box.innerHTML = '';
    }

    function renderPlaceSuggestions(box, input, results, kind) {
      if (!box || !input) return;
      if (!results.length) {
        box.innerHTML = '<div class="place-suggestion-empty">검색 결과가 없어요. 더 구체적인 지역명을 함께 입력해보세요.</div>';
        box.classList.add('open');
        return;
      }
      box.innerHTML = results.map((place, index) => `
        <button type="button" class="place-suggestion-item" data-index="${index}">
          <div class="place-suggestion-name">${escapeHTML(place.name)}</div>
          <div class="place-suggestion-address">${escapeHTML(place.label)}</div>
          <div class="tiny muted" style="margin-top:6px">${escapeHTML(place.type || '카카오맵 장소')}${place.phone ? ' · ' + escapeHTML(place.phone) : ''}</div>
        </button>
      `).join('');
      box.classList.add('open');
      box.querySelectorAll('[data-index]').forEach(btn => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
        btn.addEventListener('click', () => {
          const place = results[Number(btn.dataset.index)];
          input.value = selectedPlaceText(place);
          input.dataset.lat = String(place.lat);
          input.dataset.lon = String(place.lon);
          input.dataset.label = place.label;
          input.dataset.name = place.name;
          if (kind === 'start') state.latestStartQuery = selectedPlaceText(place);
          if (kind === 'destination') state.latestDestination = selectedPlaceText(place);
          closePlaceSuggestions(box);
        });
      });
    }

    function setupPlaceAutocomplete(inputId, boxId, kind) {
      const input = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      if (!input || !box) return;
      let timer = null;
      let requestId = 0;
      input.addEventListener('input', () => {
        clearSelectedPlace(input);
        const value = input.value.trim();
        if (kind === 'start') state.latestStartQuery = value;
        if (kind === 'destination') state.latestDestination = value;
        clearTimeout(timer);
        if (value.length < 2) {
          closePlaceSuggestions(box);
          return;
        }
        timer = setTimeout(async () => {
          const currentRequest = ++requestId;
          box.innerHTML = '<div class="place-suggestion-empty">연관검색어를 찾는 중...</div>';
          box.classList.add('open');
          try {
            const results = await searchPlaceSuggestions(value, 8);
            if (currentRequest !== requestId) return;
            renderPlaceSuggestions(box, input, results, kind);
          } catch (e) {
            if (currentRequest !== requestId) return;
            box.innerHTML = '<div class="place-suggestion-empty">장소 검색에 실패했어요. 잠시 후 다시 입력해주세요.</div>';
            box.classList.add('open');
          }
        }, 320);
      });
      input.addEventListener('focus', () => {
        if (box.innerHTML.trim()) box.classList.add('open');
      });
      input.addEventListener('blur', () => {
        setTimeout(() => closePlaceSuggestions(box), 160);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePlaceSuggestions(box);
      });
    }

    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        setState({ routeError: '현재 브라우저에서 위치 기능을 지원하지 않습니다' });
        return;
      }
      setState({ routeError: '', locationLoading: true });
      navigator.geolocation.getCurrentPosition(
        pos => {
          const loc = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            label: '현재 위치',
            address: null,  // 역지오코딩 후 채워짐
            accuracy: pos.coords.accuracy
          };
          state.currentLocation = loc;
          state.locationLoading = false;
          if (state.navigationActive) {
            updateNavigationByLocation(loc);
          }
          render();
          // 역지오코딩으로 주소 가져오기
          reverseGeocode(loc.lat, loc.lon).then(addr => {
            if (state.currentLocation) {
              state.currentLocation.address = addr;
              // 보호자가 볼 수 있도록 last_location 저장
              if (state.user) saveU('last_location', { lat: loc.lat, lon: loc.lon, address: addr });
              // 출발지 입력 필드 자동 업데이트 (주소명으로)
              const startInput = document.getElementById('startQuery');
              if (startInput && (!startInput.value.trim() || startInput.value === '현재 위치')) {
                startInput.value = '현재 위치';
                startInput.dataset.lat = String(loc.lat);
                startInput.dataset.lon = String(loc.lon);
                startInput.dataset.label = addr;
                startInput.dataset.name = addr;
              }
              render();
            }
          });
        },
        (err) => {
          const msg = err.code === 1 ? '위치 권한이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해주세요.'
            : err.code === 2 ? '위치 정보를 가져올 수 없습니다.'
            : '현재 위치를 불러오지 못했습니다 (시간 초과)';
          setState({ routeError: msg, locationLoading: false });
        },
        { enableHighAccuracy:true, timeout:10000 }
      );
    }

    async function handleRouteSearch() {
      const startQuery = document.getElementById('startQuery')?.value.trim() || '';
      const destinationQuery = document.getElementById('destinationQuery')?.value.trim() || '';
      const travelMode = normalizeTravelMode(document.getElementById('travelModeSelect')?.value || state.travelMode || 'sidewalk');
      if (!destinationQuery) {
        setState({ routeError: '목적지를 입력해주세요' });
        return;
      }
      setState({ loadingRoutes: true, routeError: '', routes: [], selectedRouteId: null, travelMode, latestStartQuery: startQuery, latestDestination: destinationQuery, navigationActive:false, navigationStepIndex:0, navigationStartedAt:null });
      try {
        let start = null;
        const selectedStart = selectedPlaceFromInput('startQuery');
        const selectedDestination = selectedPlaceFromInput('destinationQuery');
        if (startQuery) {
          start = selectedStart || await geocodePlace(startQuery);
        } else {
          start = state.currentLocation;
        }
        if (!start) throw new Error('📍 출발지를 입력하거나 현재 위치 사용 버튼을 눌러주세요');
        const destination = selectedDestination || await geocodePlace(destinationQuery);
        const result = await fetchRoute(start, destination, travelMode);
        // ORS foot-walking은 usedProfile이 'foot'으로 설정됨 - 정상적인 매칭
        // OSRM 드라이빙은 'driving'으로 설정됨
        const routes = buildRouteVariants(result.routes, travelMode, result.usedProfile);
        if (result.fallbackNotice) {
          console.warn(result.fallbackNotice);
        }
        setState({
          routes,
          selectedRouteId: routes[0]?.id || null,
          latestDestination: destinationQuery,
          latestStartQuery: startQuery,
          routeDestinationLabel: destination.label,
          routeStartLocation: { ...start, label: startQuery || '현재 위치' },
          travelMode,
          loadingRoutes: false,
          routeError: ''
        });
      } catch (e) {
        setState({ loadingRoutes: false, routeError: e.message || '경로를 찾지 못했습니다' });
      }
    }

    function startTrip() {
      const route = selectedRoute();
      if (!route) return;
      if (state.navigationActive) {
        stopNavigation();
        return;
      }
      const now = new Date();
      const endDate = new Date(now.getTime() + route.durationSeconds * 1000);
      const item = {
        id: 'h-' + Date.now(),
        date: now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0'),
        start: now.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
        end: endDate.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
        route: `${route.modeLabel || modeLabel(state.travelMode)} · ${route.name}`,
        status: '정상 귀가 예정',
        destination: state.routeDestinationLabel || state.latestDestination || '목적지'
      };
      const nextHistory = [item, ...state.history];
      const nextSharing = { enabled:true, lastSentAt: timeNow() };
      saveU(HISTORY_KEY, nextHistory);
      saveU(SHARE_KEY, nextSharing);
      state.history = nextHistory;
      state.sharing = nextSharing;
      state.tripActive = true;
      state.navigationActive = true;
      state.navigationStepIndex = 0;
      state.navigationStartedAt = now.toISOString();
      state.activeTab = 'route';
      const metrics = navigationMetrics(route);
      state.navigationRemainingMeters = metrics.remaining || route.distanceMeters;
      state.navigationProgress = metrics.progress || 0;
      startNavigationWatch();
      render();
    }

    function routeMapStyle(route, isSelected, idx) {
      const mode = normalizeTravelMode(route?.mode || state.travelMode || 'sidewalk');
      const colors = { sidewalk:'#15803d', foot:'#2563eb', car:'#b91c1c' };
      return {
        color: isSelected ? (colors[mode] || '#0f172a') : (idx === 0 ? '#334155' : '#94a3b8'),
        weight: isSelected ? 7 : 4,
        opacity: 0.9,
        dashArray: mode === 'sidewalk' ? '8 8' : mode === 'foot' ? '2 8' : null
      };
    }

    function clearMapLayers() {
      (state.mapLayers || []).forEach(layer => {
        try { layer.setMap(null); } catch (e) {}
      });
      state.mapLayers = [];
      if (state.currentMarker) {
        try { state.currentMarker.setMap(null); } catch (e) {}
        state.currentMarker = null;
      }
    }

    function kakaoLatLngFromPlace(place) {
      return new kakao.maps.LatLng(Number(place.lat), Number(place.lon));
    }

    function kakaoLatLngFromGeometryPoint(point) {
      return new kakao.maps.LatLng(Number(point[0]), Number(point[1]));
    }

    function addKakaoLabel(place, label) {
      if (!state.map || !place) return;
      const marker = new kakao.maps.Marker({
        map: state.map,
        position: kakaoLatLngFromPlace(place),
        title: label || place.label || ''
      });
      state.mapLayers.push(marker);
      const overlay = new kakao.maps.CustomOverlay({
        map: state.map,
        position: kakaoLatLngFromPlace(place),
        yAnchor: 2.25,
        content: `<div class="map-place-label">${escapeHTML(label || place.label || '')}</div>`
      });
      state.mapLayers.push(overlay);
    }

    function updateCurrentMarker() {
      if (!state.map || !state.currentLocation || !window.kakao?.maps) return;
      const position = kakaoLatLngFromPlace(state.currentLocation);
      if (!state.currentMarker) {
        state.currentMarker = new kakao.maps.CustomOverlay({
          map: state.map,
          position,
          yAnchor: 0.5,
          xAnchor: 0.5,
          content: '<div class="map-current-marker" title="현재 위치"></div>'
        });
      } else {
        state.currentMarker.setPosition(position);
        state.currentMarker.setMap(state.map);
      }
      if (state.navigationActive) {
        try { state.map.panTo(position); } catch (e) {}
      }
    }

    async function setupMap() {
      const el = document.getElementById('map');
      if (!el) return;
      const seq = ++mapSetupSeq;
      try {
        await ensureKakaoReady();
      } catch (e) {
        el.innerHTML = `<div class="alert">카카오맵을 불러오지 못했습니다. ${escapeHTML(e.message)}</div>`;
        return;
      }
      if (seq !== mapSetupSeq || !document.body.contains(el)) return;

      const routeStart = state.routeStartLocation || state.currentLocation;
      const center = routeStart ? kakaoLatLngFromPlace(routeStart) : new kakao.maps.LatLng(36.3504, 127.3845);

      // render()가 실행될 때마다 #map DOM이 새로 만들어집니다.
      // 기존 kakao.maps.Map 객체가 이전 DOM을 계속 바라보면 길찾기/탭 전환 후 지도가 사라지는 문제가 생기므로,
      // 현재 DOM과 연결된 지도인지 확인하고 다르면 카카오맵을 새로 생성합니다.
      const shouldRecreateMap = !state.map || state.mapElement !== el;
      if (shouldRecreateMap) {
        try { clearMapLayers(); } catch (e) {}
        state.map = null;
        state.currentMarker = null;
        state.mapElement = el;
        el.innerHTML = '';
        state.map = new kakao.maps.Map(el, { center, level: 5 });
        state.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      } else {
        try { state.map.relayout(); } catch (e) {}
        try { state.map.setCenter(center); } catch (e) {}
      }

      clearMapLayers();

      if (routeStart) addKakaoLabel(routeStart, routeStart.label || '출발지');
      if (state.routeDestinationLabel && state.routes.length) {
        const lastRoute = selectedRoute() || state.routes[0];
        const lastPoint = lastRoute?.geometry?.[lastRoute.geometry.length - 1];
        if (lastPoint) addKakaoLabel({ lat:lastPoint[0], lon:lastPoint[1], label:state.routeDestinationLabel }, '목적지');
      }

      const bounds = new kakao.maps.LatLngBounds();
      let hasBounds = false;
      if (routeStart) { bounds.extend(kakaoLatLngFromPlace(routeStart)); hasBounds = true; }

      if (state.routes.length) {
        state.routes.forEach((route, idx) => {
          const style = routeMapStyle(route, state.selectedRouteId === route.id, idx);
          const path = routeDisplayGeometry(route).map(kakaoLatLngFromGeometryPoint);
          if (!path.length) return;
          const polyline = new kakao.maps.Polyline({
            map: state.map,
            path,
            strokeWeight: style.weight,
            strokeColor: style.color,
            strokeOpacity: style.opacity,
            strokeStyle: style.dashArray ? 'shortdash' : 'solid'
          });
          state.mapLayers.push(polyline);
          if (state.selectedRouteId === route.id && path.length) {
            const badgePosition = path[Math.floor(path.length / 2)];
            const badgeMode = normalizeTravelMode(route.mode);
            const badge = new kakao.maps.CustomOverlay({
              map: state.map,
              position: badgePosition,
              yAnchor: 1.7,
              content: `<div class="map-route-badge ${badgeMode}">${escapeHTML(routeModeBadgeText(route))}</div>`
            });
            state.mapLayers.push(badge);
          }
          path.forEach(p => { bounds.extend(p); hasBounds = true; });
        });
      }

      updateCurrentMarker();

      const activeRoute = selectedRoute();
      if (state.navigationActive && activeRoute && state.currentLocation) {
        const metrics = navigationMetrics(activeRoute);
        state.navigationRemainingMeters = metrics.remaining;
        state.navigationProgress = metrics.progress;
      }

      if (hasBounds) {
        try { state.map.setBounds(bounds, 50, 50, 50, 50); } catch (e) {}
      }

      // 모바일 브라우저/Netlify 캐시 환경에서 지도 컨테이너 크기 계산이 늦는 경우를 보정합니다.
      requestAnimationFrame(() => {
        try {
          if (state.map && state.mapElement === el && document.body.contains(el)) {
            state.map.relayout();
            if (hasBounds) state.map.setBounds(bounds, 50, 50, 50, 50);
          }
        } catch (e) {}
      });
    }

    function boot() {
      initStorage();
      state.user = load(SESSION_KEY, null);
      if (state.user) {
        loadUserData(); // 로그인 상태면 해당 계정 데이터 로드
      } else {
        state.contacts  = defaultContacts;
        state.history   = defaultHistory;
        state.sharing   = defaultShare;
        state.favorites = defaultFavorites;
      }
      state.chatgptEndpoint = localStorage.getItem(CHATGPT_ENDPOINT_KEY) || '';
      state.chatgptEnabled = localStorage.getItem(CHATGPT_ENABLED_KEY) === 'true';
      render();
      if (state.user) requestCurrentLocation();
      setInterval(() => {
        if (state.user && state.sharing.enabled) {
          const next = { ...state.sharing, lastSentAt: timeNow() };
          saveU(SHARE_KEY, next);
          state.sharing = next;
          if (['share','guardian','dashboard','ai'].includes(state.activeTab)) render();
        }
      }, 5000);
    }

    boot();
  </script>
</body>
</html>
