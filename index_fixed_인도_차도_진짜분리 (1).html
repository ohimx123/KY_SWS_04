        const safe = estimateSafetyScore({ ...item.raw, duration }, item.kind, mode);
        const guide = modeGuide(mode);
        const fallbackNotice = [
          `길 안내 타입 고정: ${guide.guideType}`,
          `이동 위치: ${guide.guideSurface}`,
          `제외 설정: ${guide.guideAvoid}`,
          mode !== 'car'
            ? `예상 도착 시간은 ${guide.label} 평균 속도 ${guide.kmh}km/h 기준으로 별도 계산`
            : '예상 도착 시간은 차도/자동차 도로 API의 주행 시간 기준으로 계산',
          `실제 지도 요청 기준: ${guide.primaryProfile}`,
          mode !== 'car'
            ? '자동차 차도 경로로 대체하지 않고 보행자 경로만 사용'
            : '보행자 인도 경로로 대체하지 않고 자동차 도로 경로만 사용' 
        ];
        const rawGeometry = decodePolyline(item.raw.geometry);
        const displayGeometry = isPedestrianMode(mode) ? makePedestrianDisplayGeometry(rawGeometry, mode) : rawGeometry;
        return {
          id: idx + 1,
          name: item.name,
          mode,
          modeLabel: modeLabel(mode),
          guideType: guide.guideType,
          guideSurface: guide.guideSurface,
          guideAvoid: guide.guideAvoid,
          usedProfile: usedProfile || guide.primaryProfile,
          eta: formatDuration(duration),
          distance: formatDistance(item.raw.distance),
          durationSeconds: duration,
          distanceMeters: item.raw.distance,
          score: safe.score,
          reasons: [...fallbackNotice, ...safe.reasons],
          factors: safe.factors,
          geometry: rawGeometry,
          rawGeometry,
          displayGeometry,
          routeSourceProfile: usedProfile || guide.primaryProfile,
          visualNotice: isPedestrianMode(mode) ? '인도/도보 모드는 보행자 경로만 요청하고, 지도 표시선은 차도 중심선과 겹쳐 보이지 않도록 인도 방향으로 보정됩니다.' : '차도 모드는 자동차 도로 경로만 요청합니다.'
        };
      });
    }

      if (!state.user) {
        app.innerHTML = authHTML();
        bindAuth();
      } else {
        app.innerHTML = appHTML();
        bindApp();
        bindChatbot();
        if (state.chatbotOpen) {

          const nextChatBox = document.getElementById('aiChatbotMessages');
          if (input) {

          }
          if (nextChatBox) {
            nextChatBox.scrollTop = prevChatWasNearBottom ? nextChatBox.scrollHeight : prevChatScrollTop;

    function aiRiskPrediction(route = selectedRoute()) {
      const hour = new Date().getHours();
      const nightBonus = hour >= 22 || hour <= 5 ? 14 : hour >= 18 ? 7 : 0;
      let risk = route ? Math.max(8, 100 - route.score) : 42;
      if (!state.sharing.enabled) risk += 10;
      if (!state.currentLocation) risk += 5;
      if (state.batteryLevel < 30) risk += 14;
      if ((route?.mode || state.travelMode) === 'foot') risk += nightBonus;
      if ((route?.mode || state.travelMode) === 'sidewalk') risk += Math.round(nightBonus * 0.8);
      if (state.sosSent) risk += 25;
      risk = Math.max(0, Math.min(100, Math.round(risk)));
      const level = risk >= 70 ? '높음' : risk >= 45 ? '중간' : '낮음';
      const badgeClass = risk >= 70 ? 'warn' : risk >= 45 ? 'mid' : 'safe';
      const best = state.routes.length ? [...state.routes].sort((a,b) => b.score - a.score)[0] : route;
      const action = risk >= 70
        ? '밝은 큰길로 우회하고, 위치 공유와 SOS 버튼을 켜둔 상태로 이동하세요.'
        : risk >= 45
          ? '추천 안전 경로를 우선 선택하고 보호자에게 예상 도착 시간을 공유하세요.'
          : '현재 상태는 안정적입니다. 그래도 귀가 시작 버튼과 위치 공유를 함께 사용하는 것이 좋습니다.';
      const prediction = best
        ? `${best.name}이 현재 조건에서 가장 안전할 가능성이 높습니다. 안전점수 ${best.score}점, 예상 ${best.eta}입니다.`
        : '아직 계산된 경로가 없어 기본 위험도만 예측했습니다. 안전 경로 탭에서 출발지와 목적지를 입력하면 경로별로 다시 판단합니다.';
      return { risk, level, badgeClass, action, prediction, recommendedRoute: best };
    }

    function aiAnomalyDetection() {
      const route = selectedRoute();
      const elapsedSec = state.navigationStartedAt ? Math.max(0, Math.round((Date.now() - new Date(state.navigationStartedAt).getTime()) / 1000)) : 0;
      const lateAtNight = (() => { const h = new Date().getHours(); return h >= 22 || h <= 5; })();
      const signals = [
        {
          label: '장시간 정지',
          state: state.tripActive && elapsedSec > 600 && state.navigationStepIndex <= 1 ? '주의' : state.tripActive ? '모니터링 중' : '대기',
          detail: '귀가 시작 후 같은 안내 단계에 오래 머무르면 정지 가능성을 감지합니다.'
        },
        {
          label: '경로 이탈',
          state: route ? '모니터링 중' : '경로 없음',
          detail: '선택된 경로 좌표와 현재 위치 차이가 커지는 상황을 감지하도록 설계했습니다.'
        },
        {
          label: '비정상 속도 변화',
          state: state.tripActive && lateAtNight && !state.sharing.enabled ? '확인 필요' : '정상',
          detail: '인도 우선·일반 도보·차도 기준 예상 속도와 실제 이동 흐름이 크게 다르면 알림을 띄웁니다.'
        }
      ];
      const warnCount = signals.filter(s => s.state.includes('주의') || s.state.includes('확인')).length;
      const score = Math.min(100, warnCount * 35 + (state.sosSent ? 30 : 0));
      const level = score >= 70 ? '위험' : score >= 35 ? '주의' : state.tripActive ? '정상 모니터링' : '대기';
      const badgeClass = score >= 70 ? 'warn' : score >= 35 ? 'mid' : 'safe';
      return { signals, score, level, badgeClass };
    }

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')

        .replace(/'/g, '&#039;');
    }

    function routeRiskLevel(score) {
      if (score >= 85) return '안전도가 높은 편입니다';
      if (score >= 70) return '대체로 안전하지만 주변 확인이 필요합니다';
      if (score >= 55) return '보통 수준이라 밝은 큰길 위주로 이동하는 것이 좋습니다';
      return '주의가 필요한 경로입니다. 가능하면 다른 경로를 선택하거나 보호자 공유를 켜세요';
    }

    function routeAnalysisText(route) {
      if (!route) {
        return '아직 분석할 경로가 없어요. 안전 경로 탭에서 출발지와 목적지를 입력하고 “안전 경로 찾기”를 먼저 눌러주세요. 그다음 저에게 “이 경로 안전해?”라고 물어보면 현재 선택된 경로를 분석해드릴게요.';
      }
      const [label] = scoreLabel(route.score);
      const factors = route.factors.map(f => `- ${f.label}: ${f.state}`).join('\n');
      const reasons = route.reasons.map(r => `- ${r}`).join('\n');
      return `${route.modeLabel || modeLabel(state.travelMode)} · ${route.name} 분석 결과입니다.\n\n안전점수: ${route.score}/100 (${label})\n이동 기준: ${route.modeLabel || modeLabel(state.travelMode)}\n예상 이동: ${route.distance}, ${route.eta}\n판단: ${routeRiskLevel(route.score)}\n\n주요 근거\n${reasons}\n\n세부 요소\n${factors}\n\n추천 행동: ${route.score < 70 ? '위치 공유를 켜고, 가능하면 추천 안전 경로나 균형 경로를 선택하세요.' : '현재 경로로 이동해도 괜찮지만, 귀가 시작 버튼을 누르고 위치 공유를 켜는 것을 권장해요.'}`;
    }

    function compareRoutesText() {
      if (!state.routes.length) {
        return '비교할 경로가 아직 없어요. 안전 경로 탭에서 목적지를 입력하고 인도 우선/일반 도보/차도 중 이동 기준을 선택해 경로를 계산하면 추천 안전 경로, 균형 경로, 최단 경로를 안전점수 기준으로 비교해드릴 수 있어요.';
      }
      const ranked = [...state.routes].sort((a,b) => b.score - a.score);
      const lines = ranked.map((r, i) => `${i+1}. ${r.modeLabel || modeLabel(state.travelMode)} ${r.name}: ${r.score}점, ${r.distance}, ${r.eta} — ${routeRiskLevel(r.score)}`).join('\n');
      const best = ranked[0];
      const fastest = [...state.routes].sort((a,b) => a.durationSeconds - b.durationSeconds)[0];
      return `경로 비교 결과입니다.\n\n${lines}\n\n추천: 밤길 귀가라면 “${best.name}”이 가장 적합해요. ${fastest && fastest.id !== best.id ? `가장 빠른 경로는 “${fastest.name}”이지만 안전점수는 ${fastest.score}점입니다.` : '가장 빠른 경로와 안전한 경로가 크게 다르지 않아요.'}`;
    }

    function destinationHelpText(message) {
      const cleaned = message.replace(/분석|안전|경로|목적지|알려줘|어때|\?|\./g, '').trim();
      if (cleaned.length > 2) {

    function greetingText() {
      const hour = new Date().getHours();
      const timeGreeting = hour >= 18 || hour <= 5 ? '밤길 이동 전이라면 제가 더 꼼꼼하게 확인해드릴게요.' : '미리 귀가 경로를 준비해두면 밤에 더 안심할 수 있어요.';
      const route = selectedRoute();
      return `안녕하세요! 저는 밤길 안전귀가 서비스 안에서 작동하는 자체 AI 챗봇입니다.

${timeGreeting}

지금 제가 바로 도와줄 수 있는 일
- 현재 경로 안전점수 분석
- 인도 우선/일반 도보/차도 기준별 경로 판단

외부 대화 API 없이 브라우저 안의 자체 AI 판단 엔진으로 작동하도록 구성했습니다. 사용자의 문장에서 인사, 불안, 위험, 경로, 위치공유, 이동수단, SOS 의도를 분류하고 현재 사이트 상태를 함께 계산해 답변합니다.`;

    function normalizeChatText(message) {
      return message
        .toLowerCase()
        .replace(/\s+/g, '')
        .replace(/[.,!?~]/g, '')
        .replace(/안저|안전도|안저도|안전저/g, '안전')
        .replace(/경로우|겅로|경ㄹ|길/g, '경로')
        .replace(/인도|보도|보행자길|횡단보도|보행자전용/g, '인도')
        .replace(/도보오|걸어서|걷는|보행/g, '도보')
        .replace(/차도|자동차도로|자동차|운전|차량/g, '차도')
        .replace(/인도어|바이크|싸이클/g, '인도')
        .replace(/공유우|공ㅇ유|위치공유좀|위치공ㅇ/g, '공유')
        .replace(/보호쟈|보호저|보호자한테/g, '보호자')
        .replace(/긴그|긴급ㅅ|위그|위급ㅅ/g, '긴급')
        .replace(/쏘스|에스오에스|s0s/g, 'sos')
        .replace(/쳌|채크|체크크/g, '체크')
        .replace(/비굑|비교오|비교해조/g, '비교')
        .replace(/켜조|켜줘요|켜죠/g, '켜줘')
        .replace(/꺼조|꺼줘요|꺼죠/g, '꺼줘');
    }

    function hasAny(text, keywords) {
      return keywords.some(keyword => text.includes(keyword));
    }

    function editDistance(a, b) {
      if (!a || !b) return Math.max(a.length, b.length);
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }
      }
      return dp[a.length][b.length];
    }

    function fuzzyHas(text, keywords) {
      if (hasAny(text, keywords)) return true;
      const chunks = text.match(/[가-힣a-z0-9]+/g) || [];
      return chunks.some(chunk => keywords.some(keyword => {
        const limit = keyword.length <= 2 ? 1 : 2;
        return editDistance(chunk, keyword) <= limit;
      }));
    }

    function getChatbotReply(message) {
      const text = normalizeChatText(message);
      const original = message.toLowerCase();
      const wantsShare = fuzzyHas(text, ['공유', '위치공유', '위치']);
      const wantsRoute = fuzzyHas(text, ['경로', '안전', '안전해', '위험', '위험해']);
      const wantsOn = hasAny(text, ['켜', 'on', '온', '활성', '켜줘']);
      const wantsOff = hasAny(text, ['꺼', 'off', '오프', '비활성', '꺼줘']);
      const wantsMode = fuzzyHas(text, ['인도', '도보', '차도', '차', '이동기준', '기준']);

      if (hasAny(text, ['안녕', '하이', 'hello', 'hi', '반가워', 'ㅎㅇ', '안뇽', '안녕하세요'])) {
        return greetingText();
      }
      if (hasAny(text, ['생각해', '판단해', '자체ai', 'ai판단', '위험도판단'])) {
        return selfAIThinkingText(message);
      }
      if (hasAny(text, ['위험도예측', '위험예측', '안전경로추천', 'ai위험도'])) {
        return aiRiskPredictionText();
      }
      if (hasAny(text, ['이상행동', '장시간정지', '경로이탈', '속도변화', '감지결과'])) {
        return aiAnomalyDetectionText();
      }
      if (hasAny(text, ['맞춤형안전알림', '맞춤알림', '개인화', '사용자선호', '과거선택'])) {
        return aiPersonalSafetyAlertText();
      }

      if (hasAny(text, ['인도']) && (wantsMode || wantsRoute || hasAny(text, ['바꿔', '변경', '설정']))) {
        state.travelMode = 'sidewalk';
        state.routes = [];
        state.selectedRouteId = null;
        return '이동 기준을 🟢 인도 우선 보행으로 바꿨어요. 차도가 아니라 인도·횡단보도·보행자길 중심으로 안내합니다. 목적지를 다시 입력하고 안전 경로 찾기를 눌러주세요.';
      }
      if (hasAny(text, ['도보']) && (wantsMode || wantsRoute || hasAny(text, ['바꿔', '변경', '설정']))) {
        state.travelMode = 'foot';
        state.routes = [];
        state.selectedRouteId = null;
        return '이동 기준을 🚶 일반 도보로 바꿨어요. 자동차 차도가 아니라 사람이 걸을 수 있는 길 기준으로 새로 계산됩니다.';
      }
      if (hasAny(text, ['차도', '차']) && (wantsMode || wantsRoute || hasAny(text, ['바꿔', '변경', '설정']))) {
        state.travelMode = 'car';
        state.routes = [];
        state.selectedRouteId = null;
        return '이동 기준을 🚗 차도/자동차 도로로 바꿨어요. 인도 안내가 아니라 자동차 도로 기준으로 새로 계산됩니다.';
      }
      if (hasAny(text, ['인도'])) {
        return '이번 버전에서는 헷갈리지 않게 인도 우선, 일반 도보, 차도 세 가지만 사용하도록 정리했습니다. 현재 지원하지 않는 이동수단 대신 일반 도보 또는 차도 기준을 선택해주세요.';
      }
      if (wantsShare && wantsOn) {
        const next = { ...state.sharing, enabled: true, lastSentAt: timeNow() };
        save(SHARE_KEY, next);
        state.sharing = next;
        return '위치 공유를 ON으로 변경했어요. 보호자 화면에서 마지막 갱신 시간과 귀가 상태를 확인할 수 있습니다.';
      }
      if (wantsShare && wantsOff) {
        const next = { ...state.sharing, enabled: false, lastSentAt: timeNow() };
        save(SHARE_KEY, next);
        state.sharing = next;
        return '위치 공유를 OFF로 변경했어요. 밤길 이동 중이라면 다시 켜두는 것을 권장합니다.';
      }
      if (wantsMode || hasAny(text, ['인도도보차도', '도보차도', '이동수단'])) {
        return modeAdviceText();
      }
      if ((hasAny(text, ['현재', '선택', '이경로', '이길']) && wantsRoute) || hasAny(text, ['경로안전', '안전분석', '위험분석'])) {
        return routeAnalysisText(selectedRoute());
      }
      if (fuzzyHas(text, ['비교', '추천']) || hasAny(text, ['세개', '3개', '셋중'])) {
        return compareRoutesText();
      }
      if (fuzzyHas(text, ['체크', '준비']) || hasAny(text, ['귀가전', '챙길것', '확인할것'])) {
        return checklistText();
      }
      if (fuzzyHas(text, ['sos', '긴급', '신고', '위급'])) {
        return sosText();
      }
      if (fuzzyHas(text, ['보호자'])) {
        return guardianSummaryText();
      }
      if (hasAny(text, ['사용법', '기능', '뭐할수', 'ai', '에이아이', '챗봇'])) {
        return appUsageText();
      }
      if (hasAny(text, ['불안', '무서', '따라', '쫓', '어둡', '골목', '혼자', '배터리'])) {
        return selfAIThinkingText(message);
      }
      if (wantsShare || fuzzyHas(text, ['위치'])) {
        return shareStatusText();
      }
      if (fuzzyHas(text, ['기록', '이력'])) {
        const latest = state.history[0];
        return latest ? `최근 귀가 기록입니다.

날짜: ${latest.date}
출발: ${latest.start}
도착/예상 도착: ${latest.end}
경로: ${latest.route}
목적지: ${latest.destination}
상태: ${latest.status}` : '아직 저장된 귀가 기록이 없습니다.';
      }
      if (hasAny(text, ['목적지', '가는경로', '가는길', '가도', '안전해']) || original.includes('가도 돼')) {
        return destinationHelpText(message);
      }
      return selfAIThinkingText(message);
    }

    function isChatbotNearBottom(box) {
      if (!box) return true;
      return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    }

    function addChatbotMessage(role, text) {
      state.chatbotMessages = [...state.chatbotMessages, { role, text }];
      const box = document.getElementById('aiChatbotMessages');
      if (!box) return;
      const shouldStayAtBottom = role === 'user' || isChatbotNearBottom(box);
      const msg = document.createElement('div');
      msg.className = role === 'user' ? 'user-message' : 'ai-message';
      msg.textContent = text;
      box.appendChild(msg);
      if (shouldStayAtBottom) box.scrollTop = box.scrollHeight;
    }

    function buildChatGPTContext() {
      const route = selectedRoute();
      return {
        service: '밤길 안전 귀가 서비스',
        travelMode: modeLabel(state.travelMode),
        selectedRoute: route ? {
          name: route.name,
          score: route.score,
          eta: route.eta,
          distance: route.distance,
          reasons: route.reasons,
          factors: route.factors
        } : null,
        sharing: state.sharing.enabled ? 'ON' : 'OFF',
        batteryLevel: state.batteryLevel,
        tripActive: state.tripActive,
        contactsCount: state.contacts.length
      };
    }

    async function requestChatGPTReply(message) {
      if (!state.chatgptEnabled || !state.chatgptEndpoint) return null;
      const res = await fetch(state.chatgptEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          context: buildChatGPTContext(),
          messages: state.chatbotMessages.slice(-8)
        })
      });
      if (!res.ok) throw new Error('ChatGPT 서버 연결 실패');
      const data = await res.json();
      return data.reply || data.message || data.text || null;
    }

    async function sendChatbotMessage(text) {
      const message = text.trim();
      if (!message) return;
      state.chatbotDraft = '';
      addChatbotMessage('user', message);
      try {
        const gptReply = await requestChatGPTReply(message);
        addChatbotMessage('ai', gptReply || getChatbotReply(message));
      } catch (e) {
        addChatbotMessage('ai', getChatbotReply(message) + '\n\n참고: ChatGPT 서버 연결에 실패해서 사이트 내부 AI 답변으로 대신 응답했어요. 설정한 서버 주소를 확인해주세요.');
      }
      if (['share','guardian','dashboard','ai'].includes(state.activeTab)) render();
    }

    function bindChatbot() {
      const fab = document.getElementById('aiChatbotFab');
      const win = document.getElementById('aiChatbotWindow');
      const close = document.getElementById('aiChatbotClose');
      const form = document.getElementById('aiChatbotForm');
      const input = document.getElementById('aiChatbotInput');
      const endpointInput = document.getElementById('chatgptEndpointInput');
      const saveEndpointBtn = document.getElementById('saveChatgptEndpointBtn');
      const enabledToggle = document.getElementById('chatgptEnabledToggle');
      if (!fab || !win) return;
      fab.addEventListener('click', (e) => {
        e.preventDefault();
        state.chatbotOpen = !state.chatbotOpen;
        win.classList.toggle('open', state.chatbotOpen);
        if (state.chatbotOpen) {
          input?.focus();
          const box = document.getElementById('aiChatbotMessages');
          if (box) box.scrollTop = box.scrollHeight;
        }
      });
      close?.addEventListener('click', (e) => {
        e.preventDefault();
        state.chatbotOpen = false;
        win.classList.remove('open');
      });
      input?.addEventListener('input', () => {
        state.chatbotDraft = input.value;
      });
      saveEndpointBtn?.addEventListener('click', () => {
        state.chatgptEndpoint = endpointInput?.value.trim() || '';
        localStorage.setItem(CHATGPT_ENDPOINT_KEY, state.chatgptEndpoint);
        addChatbotMessage('ai', state.chatgptEndpoint ? `ChatGPT 서버 주소를 저장했어요: ${state.chatgptEndpoint}` : 'ChatGPT 서버 주소를 비웠어요. 내부 AI로만 답변합니다.');
      });
      enabledToggle?.addEventListener('change', () => {
        state.chatgptEnabled = !!enabledToggle.checked;
        localStorage.setItem(CHATGPT_ENABLED_KEY, state.chatgptEnabled ? 'true' : 'false');
        addChatbotMessage('ai', state.chatgptEnabled ? 'ChatGPT 연동을 켰어요. 서버 주소가 연결되어 있으면 ChatGPT 답변을 우선 사용합니다.' : 'ChatGPT 연동을 껐어요. 사이트 내부 AI로 답변합니다.');
      });
      form?.addEventListener('submit', (e) => {
        e.preventDefault();
        sendChatbotMessage(input.value);
        input.value = '';
      });
      document.querySelectorAll('[data-ai-quick]').forEach(btn => {
        btn.addEventListener('click', () => sendChatbotMessage(btn.dataset.aiQuick || ''));
      });
    }

    function bindAuth() {
      const tabs = document.querySelectorAll('#authTabs button');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const authError = document.getElementById('authError');
      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          loginForm.classList.toggle('hidden', tab !== 'login');
          signupForm.classList.toggle('hidden', tab !== 'signup');
          authError.classList.add('hidden');
        });
      });
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const users = load(USERS_KEY, defaultUsers);
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const found = users.find(u => u.email === email && u.password === password);
        if (!found) {
          authError.textContent = '이메일 또는 비밀번호가 맞지 않습니다';
          authError.classList.remove('hidden');
          return;
        }
        save(SESSION_KEY, found);
        state.user = found;
        render();
        requestCurrentLocation();
      });
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const users = load(USERS_KEY, defaultUsers);
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        if (!name || !email || !password) {
          authError.textContent = '모든 항목을 입력해주세요';
          authError.classList.remove('hidden');
          return;
        }
        if (users.some(u => u.email === email)) {
          authError.textContent = '이미 등록된 이메일입니다';
          authError.classList.remove('hidden');
          return;
        }
        const created = { id:'user-' + Date.now(), name, email, password, role:'USER' };
        const next = [...users, created];
        save(USERS_KEY, next);
        save(SESSION_KEY, created);
        state.user = created;
        render();
        requestCurrentLocation();
      });
    }


    function selectedPlaceFromInput(inputId) {
      const input = document.getElementById(inputId);
      if (!input || !input.dataset.lat || !input.dataset.lon) return null;
      const lat = Number(input.dataset.lat);
      const lon = Number(input.dataset.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      return {
        lat,
        lon,
        label: input.dataset.label || input.value,
        name: input.dataset.name || input.value
      };
    }

    function clearSelectedPlace(input) {
      if (!input) return;
      delete input.dataset.lat;
      delete input.dataset.lon;
      delete input.dataset.label;
      delete input.dataset.name;
    }

    function closePlaceSuggestions(box) {
      if (!box) return;
      box.classList.remove('open');
      box.innerHTML = '';
    }

    function renderPlaceSuggestions(box, input, results, kind) {
      if (!box || !input) return;
      if (!results.length) {
        box.innerHTML = '<div class="place-suggestion-empty">검색 결과가 없어요. 더 구체적인 지역명을 함께 입력해보세요.</div>';
        box.classList.add('open');
        return;
      }
      box.innerHTML = results.map((place, index) => `
        <button type="button" class="place-suggestion-item" data-index="${index}">
          <div class="place-suggestion-name">${escapeHTML(place.name)}</div>
          <div class="place-suggestion-address">${escapeHTML(place.label)}</div>
          <div class="tiny muted" style="margin-top:6px">${escapeHTML(place.type || '카카오맵 장소')}${place.phone ? ' · ' + escapeHTML(place.phone) : ''}</div>
        </button>
      `).join('');
      box.classList.add('open');
      box.querySelectorAll('[data-index]').forEach(btn => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
        btn.addEventListener('click', () => {
          const place = results[Number(btn.dataset.index)];
          input.value = selectedPlaceText(place);
          input.dataset.lat = String(place.lat);
          input.dataset.lon = String(place.lon);
          input.dataset.label = place.label;
          input.dataset.name = place.name;
          if (kind === 'start') state.latestStartQuery = selectedPlaceText(place);
          if (kind === 'destination') state.latestDestination = selectedPlaceText(place);
          closePlaceSuggestions(box);
        });
      });
    }

    function setupPlaceAutocomplete(inputId, boxId, kind) {
      const input = document.getElementById(inputId);
      const box = document.getElementById(boxId);
      if (!input || !box) return;
      let timer = null;
      let requestId = 0;
      input.addEventListener('input', () => {
        clearSelectedPlace(input);
        const value = input.value.trim();
        if (kind === 'start') state.latestStartQuery = value;
        if (kind === 'destination') state.latestDestination = value;
        clearTimeout(timer);
        if (value.length < 2) {
          closePlaceSuggestions(box);
          return;
        }
        timer = setTimeout(async () => {
          const currentRequest = ++requestId;
          box.innerHTML = '<div class="place-suggestion-empty">연관검색어를 찾는 중...</div>';
          box.classList.add('open');
          try {
            const results = await searchPlaceSuggestions(value, 8);
            if (currentRequest !== requestId) return;
            renderPlaceSuggestions(box, input, results, kind);
          } catch (e) {
            if (currentRequest !== requestId) return;
            box.innerHTML = '<div class="place-suggestion-empty">장소 검색에 실패했어요. 잠시 후 다시 입력해주세요.</div>';
            box.classList.add('open');
          }
        }, 320);
      });
      input.addEventListener('focus', () => {
        if (box.innerHTML.trim()) box.classList.add('open');
      });
      input.addEventListener('blur', () => {
        setTimeout(() => closePlaceSuggestions(box), 160);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePlaceSuggestions(box);
      });
    }

    function bindApp() {
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => setState({ activeTab: btn.dataset.nav }));
      });
      document.querySelectorAll('[data-favorite]').forEach(btn => {
        btn.addEventListener('click', () => setState({ activeTab: 'route', latestDestination: btn.dataset.favorite }));
      });
      document.querySelectorAll('[data-ai-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.aiAction;
          if (action === 'risk') showAIResult(aiRiskPredictionText());
          if (action === 'anomaly') showAIResult(aiAnomalyDetectionText());
          if (action === 'personal') showAIResult(aiPersonalSafetyAlertText());
        });
      });
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem(SESSION_KEY);
        state.user = null;
        render();
      });

      if (state.activeTab === 'route') {
        const findBtn = document.getElementById('findRouteBtn');
        const locationBtn = document.getElementById('useLocationBtn');
        const resetBtn = document.getElementById('resetRouteBtn');
        const travelModeSelect = document.getElementById('travelModeSelect');
        setupPlaceAutocomplete('startQuery', 'startSuggestions', 'start');
        setupPlaceAutocomplete('destinationQuery', 'destinationSuggestions', 'destination');
        if (findBtn) findBtn.addEventListener('click', handleRouteSearch);
        if (locationBtn) locationBtn.addEventListener('click', requestCurrentLocation);
        if (travelModeSelect) travelModeSelect.addEventListener('change', () => {
          stopNavigationWatch(); setState({ travelMode: travelModeSelect.value, routes: [], selectedRouteId: null, routeError: '', tripActive:false, navigationActive:false, navigationStepIndex:0, navigationStartedAt:null, navigationRemainingMeters:null, navigationProgress:0 });
        });
        if (resetBtn) resetBtn.addEventListener('click', () => {
          stopNavigationWatch(); setState({ routes: [], selectedRouteId: null, routeDestinationLabel: '', routeStartLocation:null, latestStartQuery:'', latestDestination:'', routeError: '', tripActive:false, navigationActive:false, navigationStepIndex:0, navigationStartedAt:null, navigationRemainingMeters:null, navigationProgress:0 });
        });
        document.querySelectorAll('[data-route-id]').forEach(el => {
          el.addEventListener('click', () => { stopNavigationWatch(); setState({ selectedRouteId: Number(el.dataset.routeId), navigationActive:false, navigationStepIndex:0, navigationStartedAt:null, navigationRemainingMeters:null, navigationProgress:0 }); });
        });
        const startTripBtn = document.getElementById('startTripBtn');
        if (startTripBtn) startTripBtn.addEventListener('click', startTrip);
        const nextNavBtn = document.getElementById('nextNavigationStepBtn');
        const prevNavBtn = document.getElementById('prevNavigationStepBtn');
        const stopNavBtn = document.getElementById('stopNavigationBtn');
        if (nextNavBtn) nextNavBtn.addEventListener('click', nextNavigationStep);
        if (prevNavBtn) prevNavBtn.addEventListener('click', prevNavigationStep);
        if (stopNavBtn) stopNavBtn.addEventListener('click', stopNavigation);
      }

      if (state.activeTab === 'ai') {
        const riskBtn = document.getElementById('runAIRiskBtn');
        const anomalyBtn = document.getElementById('simulateAnomalyBtn');
        const personalBtn = document.getElementById('createPersonalAlertBtn');
        if (riskBtn) riskBtn.addEventListener('click', () => showAIResult(aiRiskPredictionText()));
        if (anomalyBtn) anomalyBtn.addEventListener('click', () => showAIResult(aiAnomalyDetectionText()));
        if (personalBtn) personalBtn.addEventListener('click', () => showAIResult(aiPersonalSafetyAlertText()));
      }

      if (state.activeTab === 'share') {
        const toggle = document.getElementById('shareToggle');
        if (toggle) toggle.addEventListener('change', () => {
          const next = { ...state.sharing, enabled: toggle.checked, lastSentAt: timeNow() };
          save(SHARE_KEY, next);
          setState({ sharing: next });
        });
      }

      if (state.activeTab === 'sos') {
        const sosBtn = document.getElementById('sosBtn');
        if (sosBtn) sosBtn.addEventListener('click', () => {
          setState({ sosSent: true });
          setTimeout(() => setState({ sosSent: false }), 2500);
        });
      }
    }

    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        setState({ routeError: '현재 브라우저에서 위치 기능을 지원하지 않습니다' });
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          setState({
            currentLocation: {
              lat: pos.coords.latitude,
              lon: pos.coords.longitude,
              label: '현재 위치',
              accuracy: pos.coords.accuracy
            },
            routeError: ''
          });
          if (state.navigationActive) {
            updateNavigationByLocation(state.currentLocation);
            render();
          }
        },
        () => setState({ routeError: '현재 위치를 불러오지 못했습니다' }),
        { enableHighAccuracy:true, timeout:10000 }
      );
    }

    async function handleRouteSearch() {
      const startQuery = document.getElementById('startQuery')?.value.trim() || '';
      const destinationQuery = document.getElementById('destinationQuery')?.value.trim() || '';
      const travelMode = normalizeTravelMode(document.getElementById('travelModeSelect')?.value || state.travelMode || 'sidewalk');
      if (!destinationQuery) {
        setState({ routeError: '목적지를 입력해주세요' });
        return;
      }
      setState({ loadingRoutes: true, routeError: '', routes: [], selectedRouteId: null, travelMode, latestStartQuery: startQuery, latestDestination: destinationQuery, navigationActive:false, navigationStepIndex:0, navigationStartedAt:null });
      try {
        let start = null;
        const selectedStart = selectedPlaceFromInput('startQuery');
        const selectedDestination = selectedPlaceFromInput('destinationQuery');
        if (startQuery) {
          start = selectedStart || await geocodePlace(startQuery);
        } else {
          start = state.currentLocation;
        }
        if (!start) throw new Error('출발지를 입력하거나 현재 위치 사용을 먼저 눌러주세요');
        const destination = selectedDestination || await geocodePlace(destinationQuery);
        const result = await fetchRoute(start, destination, travelMode);
        const expectedProfile = modeMeta(travelMode).primaryProfile;
        if (result.usedProfile !== expectedProfile) {
          throw new Error('선택한 이동 기준과 실제 지도 경로 기준이 달라 경로 계산을 중단했습니다. 다시 안전 경로 찾기를 눌러주세요.');
        }
        const routes = buildRouteVariants(result.routes, travelMode, result.usedProfile);
        setState({
          routes,
          selectedRouteId: routes[0]?.id || null,
          latestDestination: destinationQuery,
          latestStartQuery: startQuery,
          routeDestinationLabel: destination.label,
          routeStartLocation: { ...start, label: startQuery || '현재 위치' },
          travelMode,
          loadingRoutes: false,
          routeError: ''
        });
      } catch (e) {
        setState({ loadingRoutes: false, routeError: e.message || '경로를 찾지 못했습니다' });
      }
    }

    function startTrip() {
      const route = selectedRoute();
      if (!route) return;
      if (state.navigationActive) {
        stopNavigation();
        return;
      }
      const now = new Date();
      const endDate = new Date(now.getTime() + route.durationSeconds * 1000);
      const item = {
        id: 'h-' + Date.now(),
        date: now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0'),
        start: now.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
        end: endDate.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
        route: `${route.modeLabel || modeLabel(state.travelMode)} · ${route.name}`,
        status: '정상 귀가 예정',
        destination: state.routeDestinationLabel || state.latestDestination || '목적지'
      };
      const nextHistory = [item, ...state.history];
      const nextSharing = { enabled:true, lastSentAt: timeNow() };
      save(HISTORY_KEY, nextHistory);
      save(SHARE_KEY, nextSharing);
      state.history = nextHistory;
      state.sharing = nextSharing;
      state.tripActive = true;
      state.navigationActive = true;
      state.navigationStepIndex = 0;
      state.navigationStartedAt = now.toISOString();
      state.activeTab = 'route';
      const metrics = navigationMetrics(route);
      state.navigationRemainingMeters = metrics.remaining || route.distanceMeters;
      state.navigationProgress = metrics.progress || 0;
      startNavigationWatch();
      render();
    }

    function routeMapStyle(route, isSelected, idx) {
      const mode = normalizeTravelMode(route?.mode || state.travelMode || 'sidewalk');
      const colors = { sidewalk:'#15803d', foot:'#2563eb', car:'#b91c1c' };
      return {
        color: isSelected ? (colors[mode] || '#0f172a') : (idx === 0 ? '#334155' : '#94a3b8'),
        weight: isSelected ? 7 : 4,
        opacity: 0.9,
        dashArray: mode === 'sidewalk' ? '8 8' : mode === 'foot' ? '2 8' : null
      };
    }

    function clearMapLayers() {
      (state.mapLayers || []).forEach(layer => {
        try { layer.setMap(null); } catch (e) {}
      });
      state.mapLayers = [];
      if (state.currentMarker) {
        try { state.currentMarker.setMap(null); } catch (e) {}
        state.currentMarker = null;
      }
    }

    function kakaoLatLngFromPlace(place) {
      return new kakao.maps.LatLng(Number(place.lat), Number(place.lon));
    }

    function kakaoLatLngFromGeometryPoint(point) {
      return new kakao.maps.LatLng(Number(point[0]), Number(point[1]));
    }

    function addKakaoLabel(place, label) {
      if (!state.map || !place) return;
      const marker = new kakao.maps.Marker({
        map: state.map,
        position: kakaoLatLngFromPlace(place),
        title: label || place.label || ''
      });
      state.mapLayers.push(marker);
      const overlay = new kakao.maps.CustomOverlay({
        map: state.map,
        position: kakaoLatLngFromPlace(place),
        yAnchor: 2.25,
        content: `<div class="map-place-label">${escapeHTML(label || place.label || '')}</div>`
      });
      state.mapLayers.push(overlay);
    }

    function updateCurrentMarker() {
      if (!state.map || !state.currentLocation || !window.kakao?.maps) return;
      const position = kakaoLatLngFromPlace(state.currentLocation);
      if (!state.currentMarker) {
        state.currentMarker = new kakao.maps.CustomOverlay({
          map: state.map,
          position,
          yAnchor: 0.5,
          xAnchor: 0.5,
          content: '<div class="map-current-marker" title="현재 위치"></div>'
        });
      } else {
        state.currentMarker.setPosition(position);
        state.currentMarker.setMap(state.map);
      }
      if (state.navigationActive) {
        try { state.map.panTo(position); } catch (e) {}
      }
    }

    async function setupMap() {
      const el = document.getElementById('map');
      if (!el) return;
      const seq = ++mapSetupSeq;
      try {
        await ensureKakaoReady();
      } catch (e) {
        el.innerHTML = `<div class="alert">카카오맵을 불러오지 못했습니다. ${escapeHTML(e.message)}</div>`;
        return;
      }
      if (seq !== mapSetupSeq || !document.body.contains(el)) return;

      const routeStart = state.routeStartLocation || state.currentLocation;
      const center = routeStart ? kakaoLatLngFromPlace(routeStart) : new kakao.maps.LatLng(36.3504, 127.3845);

      // render()가 실행될 때마다 #map DOM이 새로 만들어집니다.
      // 기존 kakao.maps.Map 객체가 이전 DOM을 계속 바라보면 길찾기/탭 전환 후 지도가 사라지는 문제가 생기므로,
      // 현재 DOM과 연결된 지도인지 확인하고 다르면 카카오맵을 새로 생성합니다.
      const shouldRecreateMap = !state.map || state.mapElement !== el;
      if (shouldRecreateMap) {
        try { clearMapLayers(); } catch (e) {}
        state.map = null;
        state.currentMarker = null;
        state.mapElement = el;
        el.innerHTML = '';
        state.map = new kakao.maps.Map(el, { center, level: 5 });
        state.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      } else {
        try { state.map.relayout(); } catch (e) {}
        try { state.map.setCenter(center); } catch (e) {}
      }

      clearMapLayers();

      if (routeStart) addKakaoLabel(routeStart, routeStart.label || '출발지');
      if (state.routeDestinationLabel && state.routes.length) {
        const lastRoute = selectedRoute() || state.routes[0];
        const lastPoint = lastRoute?.geometry?.[lastRoute.geometry.length - 1];
        if (lastPoint) addKakaoLabel({ lat:lastPoint[0], lon:lastPoint[1], label:state.routeDestinationLabel }, '목적지');
      }

      const bounds = new kakao.maps.LatLngBounds();
      let hasBounds = false;
      if (routeStart) { bounds.extend(kakaoLatLngFromPlace(routeStart)); hasBounds = true; }

      if (state.routes.length) {
        state.routes.forEach((route, idx) => {
          const style = routeMapStyle(route, state.selectedRouteId === route.id, idx);
          const path = routeDisplayGeometry(route).map(kakaoLatLngFromGeometryPoint);
          if (!path.length) return;
          const polyline = new kakao.maps.Polyline({
            map: state.map,
            path,
            strokeWeight: style.weight,
            strokeColor: style.color,
            strokeOpacity: style.opacity,
            strokeStyle: style.dashArray ? 'shortdash' : 'solid'
          });
          state.mapLayers.push(polyline);
          if (state.selectedRouteId === route.id && path.length) {
            const badgePosition = path[Math.floor(path.length / 2)];
            const badgeMode = normalizeTravelMode(route.mode);
            const badge = new kakao.maps.CustomOverlay({
              map: state.map,
              position: badgePosition,
              yAnchor: 1.7,
              content: `<div class="map-route-badge ${badgeMode}">${escapeHTML(routeModeBadgeText(route))}</div>`
            });
            state.mapLayers.push(badge);
          }
          path.forEach(p => { bounds.extend(p); hasBounds = true; });
        });
      }

      updateCurrentMarker();

      const activeRoute = selectedRoute();
      if (state.navigationActive && activeRoute && state.currentLocation) {
        const metrics = navigationMetrics(activeRoute);
        state.navigationRemainingMeters = metrics.remaining;
        state.navigationProgress = metrics.progress;
      }

      if (hasBounds) {
        try { state.map.setBounds(bounds, 50, 50, 50, 50); } catch (e) {}
      }

      // 모바일 브라우저/Netlify 캐시 환경에서 지도 컨테이너 크기 계산이 늦는 경우를 보정합니다.
      requestAnimationFrame(() => {
        try {
          if (state.map && state.mapElement === el && document.body.contains(el)) {
            state.map.relayout();
            if (hasBounds) state.map.setBounds(bounds, 50, 50, 50, 50);
          }
        } catch (e) {}
      });
    }

    function boot() {
      initStorage();
      state.user = load(SESSION_KEY, null);
      state.contacts = load(CONTACTS_KEY, defaultContacts);
      state.history = load(HISTORY_KEY, defaultHistory);
      state.sharing = load(SHARE_KEY, defaultShare);
      state.favorites = load(FAVORITES_KEY, defaultFavorites);
      state.chatgptEndpoint = localStorage.getItem(CHATGPT_ENDPOINT_KEY) || '';
      state.chatgptEnabled = localStorage.getItem(CHATGPT_ENABLED_KEY) === 'true';
      render();
      if (state.user) requestCurrentLocation();
      setInterval(() => {
        if (state.user && state.sharing.enabled) {
          const next = { ...state.sharing, lastSentAt: timeNow() };
          save(SHARE_KEY, next);
          state.sharing = next;
          if (['share','guardian','dashboard','ai'].includes(state.activeTab)) render();
        }
      }, 5000);
    }

    boot();
  </script>
